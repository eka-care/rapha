name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  plan-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plan and plugin are in sync
        run: ./scripts/plan-check.sh
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: atoms lint and compile
        run: python3 -m catalogue.build
      - name: compiled catalogue is committed and current
        run: git diff --exit-code catalogue/catalogue.json
      - name: guard safety checks
        run: python3 -m catalogue.tests.test_guard
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: manifests and components are valid
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate ./plugin --strict
      - name: agent frontmatter parses
        run: python3 scripts/check-agent-frontmatter.py
      - name: no skill shares a name with a command
        run: |
          dupes=$(comm -12 <(ls plugin/skills | sort) <(ls plugin/commands | sed 's/\.md$//' | sort))
          if [ -n "$dupes" ]; then echo "name collision: $dupes"; exit 1; fi
          echo "ok no collisions"
