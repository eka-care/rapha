<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The typeface the design is set in. theme.css falls back to system-ui,
         so the workspace is legible with no network; it is simply not the
         designer's drawing.

         Atkinson Hyperlegible Next (UI) and Atkinson Hyperlegible Mono
         (readout) replace Inter: both are the Braille Institute's 2025
         release, SIL OFL, drawn specifically for character disambiguation at
         low acuity (tailed l, a 0 that cannot be an O). Noto Sans Devanagari
         is the co-script, for a patient's name written in it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet" />
    <title>Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
