<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic EMR — Workspace Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* one accent: ink. blue is reserved for ABDM identity only. colour = clinical risk. */
  --eka-blue:#221E19; --eka-blue-bg:#F1ECE3; --eka-blue-100:#E2DACD;
  --eka-blue-600:#100E0B; --eka-blue-700:#3A342C;
  --abdm:#2B5BD7; --abdm-bg:#EDF1FB; --abdm-bd:#D5DFF6;
  --grad-rose:linear-gradient(140deg,#3A342C 0%,#221E19 55%,#100E0B 100%);
  --grad-rose-line:linear-gradient(90deg,#C9BCA6,#8A7C66,#C9BCA6);
  --rose-ink:#8A7C66; --rose-tint:#F5F0E7; --pink-accent:#C0AE92;
  --sh-rose:0 6px 18px rgba(34,30,25,.22);
  --success:#5B6B4E; --success-bg:#F1F2EC; --success-border:#DCE0D2;
  --warning:#8A6524; --warning-bg:#FAF3E4; --warning-border:#EBDCBC;
  --destructive:#AE3A2C; --destructive-bg:#FBEEEB; --destructive-border:#F0D3CC;
  --teal-500:#5F6B62; --teal-bg:#EFF2F0; --teal-border:#DBE1DC;
  --violet-500:#6B6257; --violet-bg:#F3F0EA; --violet-border:#E3DCD0;
  --amber-500:#8A6524; --amber-bg:#FAF3E4;
  --gray-50:#F7F3ED; --gray-100:#F1ECE4; --gray-200:#E5DED3; --gray-300:#D2C9BB;
  --gray-400:#A79B8A; --gray-500:#7C7263; --gray-600:#5C5449; --gray-700:#423C34;
  --gray-800:#2C2823; --gray-900:#1A1714;
  --surface:#FFFDFA; --canvas:#F6F1E9; --sb:#F2ECE2; --border:#E7DFD3;
  --ink:#1A1714; --ink-2:#5C5449; --ink-3:#7C7263;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --sh-card:0 1px 2px rgba(46,38,28,.05),0 1px 3px rgba(46,38,28,.04);
  --sh-hover:0 10px 26px rgba(46,38,28,.10),0 2px 6px rgba(46,38,28,.05);
  --sh-overlay:0 24px 70px rgba(30,24,16,.20);
  --sh-pop:0 12px 34px rgba(30,24,16,.13);
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --eka-blue:#EDE5D8; --eka-blue-bg:#26211A; --eka-blue-100:#3A332A;
  --eka-blue-600:#FFFFFF; --eka-blue-700:#D8CEBD;
  --abdm:#8AA9F0; --abdm-bg:#1A2033; --abdm-bd:#2C3552;
  --grad-rose:linear-gradient(140deg,#EDE5D8 0%,#D8CEBD 55%,#BFB3A0 100%);
  --grad-rose-line:linear-gradient(90deg,#6B6052,#A2937C,#6B6052);
  --rose-ink:#A2937C; --rose-tint:#221E18; --pink-accent:#6B6052;
  --sh-rose:0 6px 18px rgba(0,0,0,.5);
  --success:#9DB388; --success-bg:#1B2117; --success-border:#31402A;
  --warning:#D9A94F; --warning-bg:#2A2114; --warning-border:#54432420;
  --warning-border:#4E3E22;
  --destructive:#E08272; --destructive-bg:#2C1A16; --destructive-border:#553029;
  --teal-500:#9AAA9E; --teal-bg:#1A201C; --teal-border:#2F3A33;
  --violet-500:#B0A492; --violet-bg:#221E19; --violet-border:#3C352C;
  --amber-500:#D9A94F; --amber-bg:#2A2114;
  --gray-50:#1C1915; --gray-100:#242019; --gray-200:#302A22; --gray-300:#443C31;
  --gray-400:#6E6455; --gray-500:#948875; --gray-600:#B5A994; --gray-700:#D0C5B1;
  --gray-800:#E3DACA; --gray-900:#F5EFE4;
  --surface:#171410; --canvas:#0F0D0A; --sb:#131109; --border:#2B251D;
  --ink:#F5EFE4; --ink-2:#B5A994; --ink-3:#948875;
  --sh-card:0 1px 3px rgba(0,0,0,.5); --sh-hover:0 10px 28px rgba(0,0,0,.6);
  --sh-overlay:0 24px 70px rgba(0,0,0,.75); --sh-pop:0 12px 34px rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--canvas);color:var(--ink);
  -webkit-font-smoothing:antialiased;transition:background .25s var(--ease),color .25s var(--ease)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.sm{width:13px;height:13px}svg.i.lg{width:19px;height:19px}
.app{display:flex;height:100vh;width:100vw;overflow:hidden}
.ml-auto{margin-left:auto}

/* ---------- sidebar (Claude-style) ---------- */
.sb{width:248px;background:var(--sb);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;transition:background .25s var(--ease)}
.sb-top{padding:14px 14px 8px;display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--surface);
  border:1px solid var(--border);display:grid;place-items:center;color:var(--ink);
  box-shadow:var(--sh-card)}
.brand-mark svg{stroke-width:1.1}
.brand-n{font-size:13px;font-weight:700;letter-spacing:-.01em}
.brand-s{font-size:9.5px;color:var(--ink-3);margin-top:1px}
.sb-pad{padding:6px 10px}
.sb-btn{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:9px 11px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.14s var(--ease)}
.sb-btn:hover{background:var(--gray-100);border-color:var(--gray-300)}
.sb-btn.ghost{border-color:transparent;background:none;color:var(--ink-3);font-weight:500}
.sb-btn.ghost:hover{background:var(--gray-100);color:var(--ink-2)}
.sb-nav{padding:6px 10px 4px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;
  color:var(--ink-2);border-radius:var(--r-md);padding:8px 11px;font:inherit;font-size:12.5px;
  font-weight:500;cursor:pointer;transition:.14s var(--ease);text-align:left}
.nv:hover{background:var(--gray-100)}
.nv.on{background:var(--eka-blue-bg);color:var(--eka-blue);font-weight:600}
.nv .ct{margin-left:auto;font-size:10px;font-weight:700;background:var(--gray-200);
  color:var(--ink-3);border-radius:var(--r-pill);padding:1px 7px}
.nv.on .ct{background:var(--ink);color:var(--surface)}
.sb-sec{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--gray-400);padding:14px 14px 6px}
.sb-list{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:1px}
.th{display:flex;align-items:center;gap:9px;border:none;background:none;color:var(--ink-2);
  border-radius:var(--r-md);padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;
  transition:.14s var(--ease);text-align:left;width:100%}
.th:hover{background:var(--gray-100)}
.th.on{background:var(--gray-100);color:var(--ink);font-weight:600}
.th-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-t{font-size:9.5px;color:var(--gray-400);flex-shrink:0}
.sb-foot{border-top:1px solid var(--border);padding:9px 10px;position:relative}
.rolebtn{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--border);
  background:var(--surface);border-radius:var(--r-md);padding:8px 10px;cursor:pointer;
  font:inherit;color:var(--ink);transition:.14s var(--ease)}
.rolebtn:hover{background:var(--gray-100)}
.rb-av{width:26px;height:26px;border-radius:var(--r-sm);background:var(--eka-blue-bg);
  color:var(--eka-blue);display:grid;place-items:center;flex-shrink:0}
.rb-n{font-size:12px;font-weight:600;line-height:1.2}
.rb-s{font-size:9.5px;color:var(--ink-3);margin-top:1px}
.menu{position:absolute;bottom:calc(100% + 6px);left:10px;width:252px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-pop);
  padding:5px;z-index:40;display:none;animation:pop .14s var(--ease)}
.menu.show{display:block}
.mi{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;
  color:var(--ink-2);border-radius:var(--r-sm);padding:8px 9px;font:inherit;font-size:12px;
  cursor:pointer;text-align:left;transition:.12s var(--ease)}
.mi:hover{background:var(--gray-100)}
.mi.on{background:var(--eka-blue-bg);color:var(--eka-blue);font-weight:600}
.mi-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mi-c{flex-shrink:0;font-size:9.5px;color:var(--gray-400);font-family:ui-monospace,monospace;
  background:none;border:none;padding:0}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:11px;padding:0 18px;flex-shrink:0;transition:background .25s var(--ease)}
.tb-title{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.tb-sub{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink-2);border-radius:var(--r-pill);
  padding:6px 12px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s var(--ease)}
.pill:hover{border-color:var(--gray-300)}
.kbd{font-size:9.5px;font-weight:700;background:var(--gray-100);border:1px solid var(--border);
  border-radius:4px;padding:2px 5px;color:var(--ink-3);font-family:inherit}
.icon-btn{width:32px;height:32px;border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--surface);cursor:pointer;color:var(--ink-2);display:grid;place-items:center;transition:.15s var(--ease)}
.icon-btn:hover{background:var(--gray-100)}
.view{flex:1;overflow:hidden;display:flex;justify-content:center;padding:16px 20px}
.view.scroll{overflow-y:auto}
.wrap{max-width:1280px;width:100%;height:100%}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-card);transition:background .25s var(--ease),border-color .25s var(--ease)}
.card-h{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.card-t{font-size:12.5px;font-weight:700}
.eyebrow{font-size:10px;font-weight:700;color:var(--rose-ink);text-transform:uppercase;letter-spacing:.09em}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:var(--r-pill);border:1px solid transparent}
.b-warn{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.b-ok{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}
.b-crit{background:var(--destructive-bg);color:var(--destructive);border-color:var(--destructive-border)}
.b-mute{background:var(--gray-100);color:var(--ink-3);border-color:var(--border)}
.b-vio{background:var(--violet-bg);color:var(--violet-500);border-color:var(--violet-border)}
.b-blue{background:var(--eka-blue-bg);color:var(--eka-blue-700);border-color:var(--eka-blue-100)}

/* ---------- chat view ---------- */
.chatgrid{display:grid;grid-template-columns:1fr 300px;gap:16px;height:100%;align-items:start}
.chatcard{display:flex;flex-direction:column;height:100%}
.pt-head{padding:13px 15px;display:flex;align-items:flex-start;gap:11px;border-bottom:1px solid var(--border);flex-shrink:0}
.avatar{width:38px;height:38px;border-radius:var(--r-md);background:var(--gray-100);color:var(--ink-2);
  display:grid;place-items:center;font-weight:700;font-size:12.5px;flex-shrink:0}
.pt-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.pt-meta{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.id-badge{display:inline-flex;align-items:center;gap:5px;background:var(--abdm-bg);
  border:1.5px solid var(--abdm-bd);border-radius:var(--r-pill);padding:3px 9px}
.id-lab{color:var(--abdm);font-weight:700;font-size:8.5px;text-transform:uppercase;letter-spacing:.06em}
.id-val{color:var(--abdm);font-weight:700;font-size:10px}
.b-blue{background:var(--abdm-bg)!important;color:var(--abdm)!important;border-color:var(--abdm-bd)!important}
.sdk{border-color:var(--abdm-bd)!important;background:linear-gradient(150deg,var(--abdm-bg),var(--surface) 70%)!important}
.sdk-h{color:var(--abdm)!important}
.sdk-tab.on{background:var(--abdm)!important}
.thread{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:15px}
.msg{display:flex;gap:10px;max-width:92%}
.msg.right{margin-left:auto;flex-direction:row-reverse}
.m-av{width:25px;height:25px;border-radius:var(--r-sm);display:grid;place-items:center;
  flex-shrink:0;background:var(--gray-100);color:var(--ink-3);margin-top:2px}
.m-av.agent{background:var(--eka-blue-bg);color:var(--eka-blue)}
.m-b{min-width:0}
.m-meta{font-size:9.5px;color:var(--gray-400);font-weight:600;margin-bottom:5px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bubble{background:var(--gray-50);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:11px 13px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.msg.right .bubble{background:var(--eka-blue-bg);border-color:var(--eka-blue-100);color:var(--eka-blue-700)}
.bubble b{color:var(--ink);font-weight:600}
.bubble .t{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:4px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.kvbox{margin-top:9px;border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;background:var(--surface)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:3px 0;color:var(--ink-3)}
.kv b{color:var(--eka-blue);font-weight:700}
.kv.crit b{color:var(--destructive)}
.quote{border-left:2px solid var(--violet-border);padding-left:10px;font-style:italic;
  color:var(--ink-3);font-size:12px;line-height:1.55;margin-top:7px}
.props{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.prop{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);
  padding:9px 11px;cursor:pointer;font:inherit;color:var(--ink);transition:.15s var(--ease)}
.prop:hover:not(:disabled){border-color:var(--eka-blue);background:var(--eka-blue-bg);transform:translateX(2px)}
.prop:disabled{opacity:.45;cursor:not-allowed}
.prop.primary{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.prop.primary:hover{background:var(--eka-blue-600)}
.prop.primary .p-s{color:rgba(255,255,255,.72)}
.prop.primary .p-tag{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.p-l{font-size:12.5px;font-weight:600;line-height:1.25}
.p-s{font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.p-tag{margin-left:auto;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:3px 6px;border-radius:4px;background:var(--gray-100);color:var(--ink-3);
  border:1px solid var(--border);white-space:nowrap}
.p-tag.scribe{background:var(--violet-bg);color:var(--violet-500);border-color:var(--violet-border)}
.p-tag.form{background:var(--teal-bg);color:var(--teal-500);border-color:var(--teal-border)}
.p-tag.irr{background:var(--destructive-bg);color:var(--destructive);border-color:var(--destructive-border)}
.p-tag.hand{background:var(--eka-blue-bg);color:var(--eka-blue-700);border-color:var(--eka-blue-100)}
.empty{margin:auto;text-align:center;color:var(--ink-3);font-size:12.5px;line-height:1.6;max-width:340px}
.composer{border-top:1px solid var(--border);padding:11px 14px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.composer input{flex:1;border:1px solid var(--border);background:var(--gray-50);color:var(--ink);
  border-radius:var(--r-pill);padding:10px 15px;font:inherit;font-size:12.5px;outline:none}
.composer input:focus{border-color:var(--eka-blue);background:var(--surface)}
.btn{border:none;border-radius:var(--r-md);padding:9px 14px;font:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer;transition:.15s var(--ease);white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px}
.btn-b{background:var(--ink);color:var(--surface)}.btn-b:hover{background:var(--eka-blue-600)}
.btn-g{background:var(--surface);color:var(--ink-2);border:1px solid var(--border)}
.btn-g:hover{background:var(--gray-100)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.send{width:36px;height:36px;padding:0;border-radius:50%;justify-content:center}
.panel{display:flex;flex-direction:column;gap:13px;height:100%;overflow-y:auto}
.states{padding:9px 12px}
.st{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:11.5px;color:var(--gray-400)}
.st .n{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--gray-300);
  display:grid;place-items:center;flex-shrink:0;font-size:9px;font-weight:700}
.st.done{color:var(--ink-2)}.st.done .n{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.st.now{color:var(--eka-blue);font-weight:700}
.st.now .n{border-color:var(--eka-blue);background:var(--eka-blue-bg);color:var(--eka-blue)}
.caps{padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px}
.cap{font-size:9px;font-weight:600;font-family:ui-monospace,monospace;padding:3px 6px;
  border-radius:4px;background:var(--gray-100);color:var(--gray-400);border:1px solid var(--border)}
.cap.on{background:var(--eka-blue-bg);color:var(--eka-blue-700);border-color:var(--eka-blue-100)}
.audit{padding:8px 12px;max-height:150px;overflow-y:auto}
.au{display:flex;gap:8px;font-size:10px;padding:5px 0;border-bottom:1px dashed var(--border);color:var(--gray-400)}
.au:last-child{border:none}
.au b{color:var(--ink-2);font-weight:600;font-family:ui-monospace,monospace;font-size:9.5px}
.nudge{font-size:11px;color:var(--rose-ink);background:var(--rose-tint);
  border-left:3px solid var(--pink-accent);border-radius:var(--r-sm);padding:8px 10px;margin:0 12px 12px;line-height:1.5}

/* ---------- queue ---------- */
.qtabs{display:flex;gap:5px;background:var(--gray-100);padding:4px;border-radius:var(--r-md);margin-bottom:14px;flex-wrap:wrap}
.qtab{border:none;background:none;padding:7px 13px;border-radius:var(--r-sm);font:inherit;
  font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer;transition:.14s var(--ease);
  display:flex;align-items:center;gap:7px}
.qtab.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-card)}
.qtab .n{font-size:9.5px;font-weight:700;background:var(--gray-200);color:var(--ink-3);
  border-radius:var(--r-pill);padding:1px 6px}
.qtab.on .n{background:var(--ink);color:var(--surface)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.qc{padding:13px;cursor:pointer;transition:.15s var(--ease)}
.qc:hover{transform:translateY(-1px);box-shadow:var(--sh-hover);border-color:var(--eka-blue-100)}
.qc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qc-n{font-size:13px;font-weight:700}
.qc-m{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.qc-tok{margin-left:auto;font-size:10px;font-weight:700;color:var(--ink-3);
  background:var(--gray-100);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 7px}
.qc-chips{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- directory ---------- */
.dir-bar{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
.dir-in{flex:1;min-width:190px;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:var(--r-md);padding:9px 12px;font:inherit;font-size:12.5px;outline:none}
.dir-in:focus{border-color:var(--eka-blue)}
.f-chip{border:1px solid var(--border);background:var(--surface);color:var(--ink-3);
  border-radius:var(--r-pill);padding:7px 14px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:.14s var(--ease)}
.f-chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
table{width:100%;border-collapse:collapse}
th{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-400);
  text-align:left;padding:10px 13px;border-bottom:1px solid var(--border)}
td{font-size:12px;padding:11px 13px;border-bottom:1px solid var(--border);color:var(--ink-2)}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.12s var(--ease)}
tbody tr:hover{background:var(--gray-50)}
td.n{font-weight:600;color:var(--ink)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- admin ---------- */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.arow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border)}
.arow:last-child{border-bottom:none}
.ar-n{font-size:12px;font-weight:600}
.ar-s{font-size:10px;color:var(--ink-3);margin-top:1px;font-family:ui-monospace,monospace}
.sw{width:34px;height:19px;border-radius:var(--r-pill);background:var(--gray-300);position:relative;
  cursor:pointer;border:none;flex-shrink:0;transition:.16s var(--ease)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#fff;transition:.16s var(--ease)}
.sw.on{background:var(--ink)}.sw.on::after{transform:translateX(15px)}
.ai-box{padding:13px;border-top:1px solid var(--border);background:var(--gray-50)}
.ai-in{display:flex;gap:8px}
.ai-in input{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:var(--r-md);padding:9px 12px;font:inherit;font-size:12px;outline:none}
.ai-in input:focus{border-color:var(--eka-blue)}
.prop-card{margin-top:11px;border:1px solid var(--violet-border);background:var(--violet-bg);
  border-radius:var(--r-md);padding:12px 13px}
.pc-h{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--violet-500);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pc-r{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:3px 0;color:var(--ink-3)}
.pc-r b{color:var(--ink-2);font-weight:600;font-family:ui-monospace,monospace;font-size:11px;text-align:right}

/* ---------- scribe session ---------- */
.scbtn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:var(--r-pill);
  padding:8px 15px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;
  background:var(--ink);color:var(--surface);box-shadow:var(--sh-card);transition:.15s var(--ease)}
.scbtn:hover{transform:translateY(-1px)}
.scbtn.live{background:var(--destructive);color:#fff;box-shadow:0 0 0 0 rgba(220,38,38,.5);animation:live 1.5s infinite}
@keyframes live{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 9px rgba(220,38,38,0)}}
.scbtn .t{font-variant-numeric:tabular-nums;opacity:.85}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(500px,94vw);background:var(--surface);
  border-left:1px solid var(--border);box-shadow:var(--sh-overlay);z-index:70;
  display:none;flex-direction:column;animation:slide .22s var(--ease)}
.sheet.show{display:flex}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sh-h{padding:15px 17px;border-bottom:1px solid var(--border)}
.sh-t{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.sh-s{font-size:11px;color:var(--ink-3);margin-top:3px}
.lang{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.lp{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--gray-50);
  border-radius:var(--r-md);padding:5px 9px}
.lp-l{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-400)}
.lp select{border:none;background:none;font:inherit;font-size:11.5px;font-weight:600;
  color:var(--ink);outline:none;cursor:pointer}
.sh-tabs{display:flex;gap:3px;padding:9px 17px 0}
.sh-tab{border:none;background:none;padding:8px 12px;border-radius:var(--r-sm) var(--r-sm) 0 0;
  font:inherit;font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer;
  border-bottom:2px solid transparent;transition:.14s var(--ease)}
.sh-tab.on{color:var(--eka-blue);border-bottom-color:var(--eka-blue)}
.sh-tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--destructive);
  margin-left:5px;vertical-align:middle;animation:live 1.5s infinite}
.sh-b{flex:1;overflow-y:auto;padding:15px 17px;border-top:1px solid var(--border)}
.sh-f{padding:12px 17px;border-top:1px solid var(--border);display:flex;gap:9px;align-items:center}
.tl{padding:9px 0;border-bottom:1px dashed var(--border)}
.tl:last-child{border:none}
.tl-w{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--gray-400);margin-bottom:4px}
.tl-o{font-size:13px;color:var(--ink);line-height:1.6}
.tl-g{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:3px;font-style:italic}
.tl.new{animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wave{display:flex;align-items:center;gap:2px;height:16px}
.wave i{width:2.5px;background:var(--destructive);border-radius:2px;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.15s}
@keyframes wv{0%,100%{height:4px}50%{height:15px}}
.sc-hero{border:1.5px dashed var(--border);border-radius:var(--r-lg);padding:22px 18px;text-align:center;
  margin-bottom:11px;transition:.16s var(--ease);cursor:pointer;background:var(--gray-50)}
.sc-hero:hover{border-color:var(--pink-accent);background:var(--rose-tint)}
.sc-hero .mic{margin-bottom:11px}
.sc-hero b{font-size:13.5px;font-weight:700;display:block}
.sc-hero span{font-size:11.5px;color:var(--ink-3);display:block;margin-top:4px;line-height:1.5}
.outbox{border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:11px;overflow:hidden}
.out-h{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--gray-50);
  border-bottom:1px solid var(--border);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-3)}
.out-b{padding:12px;font-size:12.5px;line-height:1.65;color:var(--ink-2);white-space:pre-line}
.out-b.te{font-size:13.5px;line-height:1.75;color:var(--ink)}

/* ---------- abha sdk & composer actions ---------- */
.sdk{border:1.5px solid var(--eka-blue-100);background:linear-gradient(150deg,var(--eka-blue-bg),var(--surface) 70%);
  border-radius:var(--r-lg);padding:13px 14px;margin-bottom:13px}
.sdk-h{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--eka-blue-700)}
.sdk-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:3px;margin-top:11px}
.sdk-tab{flex:1;border:none;background:none;padding:7px 6px;border-radius:var(--r-sm);font:inherit;
  font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer;transition:.14s var(--ease)}
.sdk-tab.on{background:var(--eka-blue);color:#fff}
.sdk-note{display:flex;gap:7px;align-items:flex-start;font-size:10.5px;color:var(--ink-3);
  line-height:1.5;margin-top:11px}
.skip{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:1px dashed var(--border);
  background:none;border-radius:var(--r-md);padding:11px 12px;cursor:pointer;font:inherit;
  color:var(--ink-2);margin-top:4px;transition:.14s var(--ease)}
.skip:hover{border-color:var(--eka-blue);background:var(--gray-50)}
.skip b{font-size:12px;font-weight:600;color:var(--ink)}
.verified{border:1.5px solid var(--success-border);background:var(--success-bg);
  border-radius:var(--r-md);padding:12px 13px;margin-bottom:13px}
.v-h{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--success);margin-bottom:8px}
.verified .pc-r b{color:var(--ink)}
.cbar{display:flex;gap:6px;padding:0 0 9px;overflow-x:auto}
.cq{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-2);border-radius:var(--r-pill);padding:6px 12px;font:inherit;font-size:11.5px;
  font-weight:600;cursor:pointer;white-space:nowrap;transition:.14s var(--ease)}
.cq:hover:not(:disabled){border-color:var(--eka-blue);color:var(--eka-blue);background:var(--eka-blue-bg)}
.cq:disabled{opacity:.4;cursor:not-allowed}
.cq.rose{border-color:transparent;background:var(--ink);color:var(--surface);box-shadow:var(--sh-card)}
.cq.rose:hover{transform:translateY(-1px);color:var(--surface);background:var(--gray-800)}
.crow{display:flex;gap:8px;align-items:center}

/* ---------- analytics ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px;margin-bottom:16px}
.mc{padding:14px 15px;position:relative;overflow:hidden}
.mc-l{font-size:10.5px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.mc-v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:9px;font-variant-numeric:tabular-nums}
.mc-v small{font-size:13px;font-weight:700;color:var(--ink-3);margin-left:2px}
.mc-d{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:var(--r-pill);margin-top:8px}
.mc-d.up{background:var(--success-bg);color:var(--success)}
.mc-d.dn{background:var(--destructive-bg);color:var(--destructive)}
.mc-d.fl{background:var(--gray-100);color:var(--ink-3)}
.mc-id{font-size:9px;font-family:ui-monospace,monospace;color:var(--gray-400);margin-top:9px}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:11px}
.spark i{flex:1;background:var(--eka-blue-100);border-radius:2px 2px 0 0;min-height:2px;transition:.2s var(--ease)}
.spark i.hi{background:var(--eka-blue)}
.chart{padding:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-bottom:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--gray-700),var(--ink));
  min-height:3px;transition:.3s var(--ease)}
.bar i.mut{background:var(--gray-300)}
.bar span{font-size:9.5px;color:var(--gray-400);white-space:nowrap}
.bar b{font-size:10px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ln{width:100%;height:180px}
.ln path.area{fill:url(#lg);stroke:none}
.ln path.line{fill:none;stroke:var(--eka-blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln circle{fill:var(--surface);stroke:var(--eka-blue);stroke-width:2}
.ln line{stroke:var(--border);stroke-width:1}
.ln text{font-size:9.5px;fill:var(--gray-400);font-family:Inter,sans-serif}
.mr{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border)}
.mr:last-child{border-bottom:none}
.mr-n{font-size:12px;font-weight:600}
.mr-d{font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.mr-v{font-size:9px;font-family:ui-monospace,monospace;color:var(--gray-400);
  border:1px solid var(--border);border-radius:4px;padding:2px 5px;flex-shrink:0}
.deny{border:1px solid var(--warning-border);background:var(--warning-bg);border-radius:var(--r-md);
  padding:13px 14px;margin-top:12px}
.deny-h{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--warning);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.used{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.used span{font-size:9.5px;font-family:ui-monospace,monospace;background:var(--eka-blue-bg);
  color:var(--eka-blue-700);border:1px solid var(--eka-blue-100);border-radius:4px;padding:3px 7px}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--border);
  background:linear-gradient(122deg,var(--surface) 0%,var(--gray-50) 58%,var(--rose-tint) 128%);
  padding:26px 26px 22px;box-shadow:var(--sh-card)}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-rose-line)}
.hero-mark{position:absolute;top:-62px;right:-52px;width:290px;height:290px;color:var(--ink);
  opacity:.052;pointer-events:none;stroke-width:.35;fill:none;stroke:currentColor;
  stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .hero-mark{opacity:.075}
.hero-eye{font-size:10.5px;font-weight:700;color:var(--rose-ink);text-transform:uppercase;letter-spacing:.1em}
.hero-h{font-size:27px;font-weight:800;letter-spacing:-.028em;margin-top:7px;line-height:1.15}
.hero-h span{color:var(--ink-3);font-weight:600}
.hero-sub{font-size:12.5px;color:var(--ink-3);margin-top:7px;line-height:1.55;max-width:560px}
.hero-ask{display:flex;align-items:center;gap:11px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-pill);padding:12px 18px;margin-top:20px;max-width:640px;cursor:text;
  transition:.16s var(--ease);position:relative;z-index:1}
.hero-ask:hover{border-color:var(--eka-blue);box-shadow:0 6px 20px rgba(33,95,255,.10)}
.hero-ask input{flex:1;border:none;background:none;font:inherit;font-size:14px;color:var(--ink);outline:none}
.hero-ask input::placeholder{color:var(--gray-400)}
.chips{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;position:relative;z-index:1}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:var(--r-pill);
  padding:6px 13px;font:inherit;font-size:11.5px;font-weight:500;cursor:pointer;transition:.14s var(--ease)}
.chip:hover{border-color:var(--eka-blue);color:var(--eka-blue);background:var(--eka-blue-bg)}
.arc{position:absolute;top:24px;right:26px;text-align:right;z-index:1}
.arc-l{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--gray-400)}
.arc-t{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.arc-bar{width:132px;height:5px;border-radius:999px;background:var(--gray-200);margin-top:8px;overflow:hidden}
.arc-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gray-600),var(--ink))}
.arc-s{font-size:10px;color:var(--ink-3);margin-top:5px}

.brief{display:flex;gap:12px;padding:15px 16px}
.brief-av{width:30px;height:30px;border-radius:var(--r-sm);background:var(--eka-blue-bg);color:var(--eka-blue);
  display:grid;place-items:center;flex-shrink:0}
.brief-t{font-size:13px;line-height:1.65;color:var(--ink-2)}
.brief-t b{color:var(--ink);font-weight:600}
.brief-t em{font-style:normal;color:var(--eka-blue);font-weight:600;cursor:pointer;
  border-bottom:1px dashed var(--eka-blue-100)}
.brief-t em:hover{border-bottom-style:solid}

.flow{display:flex;gap:0;padding:16px 14px;overflow-x:auto}
.fl-col{min-width:132px;flex:1;position:relative;padding:0 7px}
.fl-h{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.fl-n{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.fl-c{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.fl-rail{height:4px;border-radius:999px;background:var(--gray-200);margin-bottom:11px;overflow:hidden;position:relative}
.fl-rail i{position:absolute;inset:0;border-radius:999px;
  background:linear-gradient(90deg,transparent,var(--ink),transparent);
  background-size:60% 100%;background-repeat:no-repeat;animation:flow 2.4s linear infinite}
@keyframes flow{from{background-position:-60% 0}to{background-position:160% 0}}
.fl-col.jam .fl-rail{background:var(--warning-border)}
.fl-col.jam .fl-rail i{background:linear-gradient(90deg,transparent,var(--warning),transparent);
  background-size:60% 100%;background-repeat:no-repeat}
.fl-p{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid var(--border);
  background:var(--surface);border-radius:var(--r-sm);margin-bottom:5px;cursor:pointer;
  font-size:11px;transition:.14s var(--ease)}
.fl-p:hover{border-color:var(--eka-blue);background:var(--eka-blue-bg);transform:translateX(2px)}
.fl-av{width:20px;height:20px;border-radius:4px;background:var(--gray-100);color:var(--ink-2);
  display:grid;place-items:center;font-size:8.5px;font-weight:700;flex-shrink:0}
.fl-p.alert{border-color:var(--destructive-border);background:var(--destructive-bg)}
.fl-p.alert .fl-av{background:var(--destructive);color:var(--surface)}
.fl-e{font-size:10.5px;color:var(--gray-400);padding:6px 2px}
.fl-jam{font-size:9.5px;font-weight:700;color:var(--warning);margin-top:7px;
  display:flex;align-items:center;gap:4px}

.hgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.att{padding:6px 0}
.at{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:.14s var(--ease)}
.at:last-child{border-bottom:none}
.at:hover{background:var(--gray-50)}
.at-ic{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;flex-shrink:0;
  background:var(--gray-100);color:var(--ink-3)}
.at-ic.red{background:var(--destructive-bg);color:var(--destructive)}
.at-ic.amb{background:var(--warning-bg);color:var(--warning)}
.at-ic.blue{background:var(--eka-blue-bg);color:var(--eka-blue)}
.at-t{font-size:12.5px;font-weight:600}
.at-s{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.at-go{font-size:10.5px;font-weight:700;color:var(--eka-blue);opacity:0;transition:.14s var(--ease)}
.at:hover .at-go{opacity:1}
.pulse{padding:14px 15px;display:flex;flex-direction:column;gap:15px}
.pu-r{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-3)}
.pu-v{font-size:22px;font-weight:800;letter-spacing:-.025em;color:var(--ink);font-variant-numeric:tabular-nums}
.pu-v small{font-size:11px;font-weight:600;color:var(--ink-3);margin-left:3px}
.split{display:flex;height:7px;border-radius:999px;overflow:hidden;margin-top:7px;background:var(--gray-200)}
.split i{display:block;height:100%}
.leg{display:flex;gap:14px;margin-top:7px;font-size:10.5px;color:var(--ink-3)}
.leg span{display:flex;align-items:center;gap:5px}
.dt{width:7px;height:7px;border-radius:50%}
.cont{display:flex;gap:9px;overflow-x:auto;padding:13px 15px}
.cn{min-width:170px;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 11px;
  cursor:pointer;transition:.14s var(--ease);background:var(--surface)}
.cn:hover{border-color:var(--eka-blue);transform:translateY(-1px);box-shadow:var(--sh-hover)}
.cn-n{font-size:12px;font-weight:600}
.cn-s{font-size:10.5px;color:var(--ink-3);margin-top:3px}
@media(max-width:1000px){.hgrid{grid-template-columns:1fr}.arc{position:static;text-align:left;margin-top:16px}}

/* ---------- organisation ---------- */
.orggrid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.tree{padding:8px}
.tn{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;color:var(--ink-2);
  border-radius:var(--r-sm);padding:7px 9px;font:inherit;font-size:12px;cursor:pointer;
  text-align:left;transition:.12s var(--ease)}
.tn:hover{background:var(--gray-100)}
.tn.on{background:var(--eka-blue-bg);color:var(--eka-blue);font-weight:600}
.tn .tk{margin-left:auto;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--gray-400);background:var(--gray-100);border:1px solid var(--border);border-radius:4px;padding:2px 5px}
.tn.on .tk{background:var(--ink);color:var(--surface);border-color:transparent}
.tn .warn{color:var(--warning)}
.spine{border-left:1px dashed var(--border);margin-left:16px;padding-left:6px}
.det-h{padding:15px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.det-av{width:42px;height:42px;border-radius:var(--r-md);background:var(--eka-blue-bg);color:var(--eka-blue);
  display:grid;place-items:center;flex-shrink:0}
.det-n{font-size:15px;font-weight:700;letter-spacing:-.01em}
.det-s{font-size:11px;color:var(--ink-3);margin-top:2px}
.drow{display:flex;justify-content:space-between;gap:16px;padding:9px 15px;
  border-bottom:1px solid var(--border);font-size:11.5px;color:var(--ink-3)}
.drow:last-child{border-bottom:none}
.drow b{color:var(--ink-2);font-weight:600;text-align:right}
.drow.miss b{color:var(--warning)}
.drow code{font-family:ui-monospace,monospace;font-size:11px}
.sec-lab{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--gray-400);padding:13px 15px 7px;border-bottom:1px solid var(--border);background:var(--gray-50)}
.prow{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.p-av{width:28px;height:28px;border-radius:var(--r-sm);background:var(--gray-100);color:var(--ink-2);
  display:grid;place-items:center;font-size:10.5px;font-weight:700;flex-shrink:0}
.team{padding:10px 12px}
.tm{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:11.5px;color:var(--ink-2)}
.tm .r{margin-left:auto;font-size:9.5px;color:var(--gray-400)}

/* ---------- spotlight ---------- */
.ov{position:fixed;inset:0;background:rgba(10,13,20,.42);backdrop-filter:blur(6px) saturate(1.1);
  display:none;z-index:60;align-items:flex-start;justify-content:center;padding-top:10vh}
.ov.show{display:flex}
.spot{width:min(780px,95vw);background:var(--surface);border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--sh-overlay);overflow:hidden;animation:pop .17s var(--ease)}
@keyframes pop{from{transform:scale(.975);opacity:0}to{transform:scale(1);opacity:1}}
.spot-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.spot-in svg{width:19px;height:19px;color:var(--gray-400)}
.spot-in input{flex:1;border:none;background:none;font:inherit;font-size:19px;
  font-weight:500;color:var(--ink);outline:none;letter-spacing:-.01em}
.spot-in input::placeholder{color:var(--gray-400);font-weight:400}
.spot-body{display:flex;height:356px}
.spot-list{width:296px;border-right:1px solid var(--border);overflow-y:auto;padding:7px}
.spot-sec{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--gray-400);padding:9px 9px 5px}
.sr{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:var(--r-md);cursor:pointer}
.sr.sel{background:var(--ink);color:var(--surface)}
.sr.sel .sr-m,.sr.sel .sr-ic{color:rgba(255,255,255,.78)}
.sr-ic{color:var(--ink-3);display:grid;place-items:center}
.sr-n{font-size:12.5px;font-weight:600}
.sr-m{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.spot-prev{flex:1;padding:19px;overflow-y:auto;background:var(--gray-50)}
.pv-top{display:flex;align-items:center;gap:13px;margin-bottom:15px}
.pv-av{width:50px;height:50px;border-radius:var(--r-lg);background:var(--surface);
  border:1px solid var(--border);display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--ink-2)}
.pv-n{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.pv-s{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.pv-rows{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:9px 12px;margin-bottom:15px}
.pv-r{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;padding:4px 0;color:var(--ink-3)}
.pv-r b{color:var(--ink-2);font-weight:600;text-align:right}
.pv-lab{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--gray-400);margin-bottom:8px}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.qa-b{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);
  background:var(--surface);border-radius:var(--r-md);cursor:pointer;font:inherit;
  font-size:11.5px;font-weight:600;color:var(--ink-2);transition:.14s var(--ease);text-align:left}
.qa-b:hover:not(:disabled){border-color:var(--eka-blue);color:var(--eka-blue);background:var(--eka-blue-bg)}
.qa-b:disabled{opacity:.4;cursor:not-allowed}
.spot-foot{padding:9px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--gray-400);
  display:flex;gap:15px;align-items:center;background:var(--surface)}
.hint{font-size:10.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}

/* ---------- modal ---------- */
.mod{width:min(520px,94vw);background:var(--surface);border-radius:var(--r-xl);
  box-shadow:var(--sh-overlay);overflow:hidden;animation:pop .16s var(--ease);
  max-height:86vh;display:flex;flex-direction:column}
.mod-bar{height:3px;background:var(--grad-rose-line)}
.mod-h{padding:16px 18px 13px;border-bottom:1px solid var(--border)}
.mod-t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.mod-s{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.mod-b{padding:16px 18px;overflow-y:auto;flex:1}
.mod-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:9px;align-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);
  background:var(--gray-50);color:var(--ink);border-radius:var(--r-sm);padding:9px 11px;
  font:inherit;font-size:12.5px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--eka-blue);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.draft{border:1px solid var(--violet-border);background:var(--violet-bg);border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:14px}
.draft-h{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--violet-500);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.draft-t{font-size:12px;color:var(--ink-2);line-height:1.55;font-style:italic}
.warn-box,.crit-box{border-radius:var(--r-md);padding:10px 12px;font-size:11.5px;
  line-height:1.5;margin-bottom:13px;display:flex;gap:8px;align-items:flex-start}
.warn-box{border:1px solid var(--warning-border);background:var(--warning-bg);color:var(--warning);font-weight:500}
.crit-box{border:1px solid var(--destructive-border);background:var(--destructive-bg);color:var(--destructive)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;color:var(--ink-2);
  padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;line-height:1.45}
.chk input{margin-top:2px;accent-color:var(--eka-blue);width:15px;height:15px;flex-shrink:0}
.readback{border:1.5px solid var(--eka-blue);background:var(--eka-blue-bg);border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:13px}
.rb-l{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--eka-blue-700);margin-bottom:7px}
.rb-v{font-size:22px;font-weight:800;color:var(--eka-blue);letter-spacing:-.025em}
.mic{width:50px;height:50px;border-radius:50%;background:var(--ink);color:var(--surface);border:none;
  cursor:pointer;box-shadow:var(--sh-card);display:grid;place-items:center;margin:0 auto 10px}
.mic svg{width:19px;height:19px}
.mic.rec{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,30,25,.35)}50%{box-shadow:0 0 0 13px rgba(34,30,25,0)}}
.dest{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--border);
  background:var(--surface);border-radius:var(--r-md);padding:11px 12px;cursor:pointer;
  font:inherit;color:var(--ink);margin-bottom:7px;transition:.14s var(--ease);text-align:left}
.dest:hover{border-color:var(--eka-blue);background:var(--eka-blue-bg)}
.dest.sel{border-color:var(--eka-blue);background:var(--eka-blue-bg)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:#1A1714;color:#F5EFE4;border-radius:var(--r-md);padding:11px 17px;
  display:flex;align-items:center;gap:9px;opacity:0;transition:.2s var(--ease);
  z-index:90;font-size:12.5px;font-weight:500;pointer-events:none;box-shadow:var(--sh-overlay)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .dot{width:8px;height:8px;border-radius:50%;background:#C9BCA6;
  box-shadow:0 0 0 4px rgba(201,188,166,.22);flex-shrink:0}

@media(max-width:1100px){.chatgrid{grid-template-columns:1fr}.panel{display:none}.agrid{grid-template-columns:1fr}}
@media(max-width:900px){.sb{display:none}.spot-body{flex-direction:column;height:auto}
  .spot-list{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:150px}}
</style>
</head>

function attention(){
 const c=ROLES[S.role].caps,td=PATIENTS.filter(p=>p.today),a=[];
 const crit=td.filter(p=>p.v.labResult&&!p.v.dispensed);
 const flagged=td.filter(p=>p.v.vitalsFlag&&!p.v.consult);
 const toDisp=td.filter(p=>p.v.rx&&!p.v.dispensed);
 const toLab=td.filter(p=>p.v.labOrder&&!p.v.labResult);
 const noAbha=PATIENTS.filter(p=>!p.abha&&!p.v.abha);
 const low=STOCK.filter(s=>s.q<s.r);
 const gaps=nodes().filter(n=>missing(n)).length+PEOPLE.filter(p=>missingP(p)).length;
 if(c.includes('encounter.document')){
  crit.forEach(p=>a.push({t:'red',ic:'alert',n:`Critical result — ${p.name}`,s:'HbA1c 9.4% committed, not yet reviewed',go:()=>openPatient(p.id)}));
  flagged.forEach(p=>a.push({t:'amb',ic:'vitals',n:`BP flagged — ${p.name}`,s:'158/96, stage 2, waiting for consultation',go:()=>openPatient(p.id)}));}
 if(c.includes('lab.result.enter'))
  toLab.forEach(p=>a.push({t:'blue',ic:'flask',n:`Sample pending — ${p.name}`,s:'HbA1c ordered, no result entered',go:()=>openPatient(p.id)}));
 if(c.includes('pharmacy.dispense')){
  toDisp.forEach(p=>a.push({t:'blue',ic:'box',n:`Ready to dispense — ${p.name}`,s:'Prescription confirmed',go:()=>openPatient(p.id)}));
  low.forEach(s=>a.push({t:'red',ic:'box',n:`${s.n} below reorder`,s:`${s.q} on hand against a reorder level of ${s.r}`,go:()=>go('admin')}));}
 if(c.includes('abha.link')&&noAbha.length)
  a.push({t:'amb',ic:'id',n:`${noAbha.length} patients without ABHA`,s:'On the unlinked worklist — surface at next contact',go:()=>{S.dirQ='';go('directory');}});
 if(c.includes('facility.admin')){
  low.forEach(s=>a.push({t:'red',ic:'box',n:`${s.n} below reorder`,s:`${s.q} on hand against ${s.r}`,go:()=>go('admin')}));
  if(gaps)a.push({t:'amb',ic:'home',n:`${gaps} org records incomplete`,s:'Required details missing before go-live',go:()=>go('org')});}
 if(c.includes('visit.household'))
  a.push({t:'blue',ic:'home',n:'2 households overdue in Yadiki',s:'NCD follow-up more than 30 days since last contact',go:()=>go('directory')});
 return a.slice(0,6);}

function lineChart(id){const m=METRICS[id],s=m.s.slice(0,-1),n=s.length;

 const X=i=>40+i*(560/(n-1)),Y=v=>150-((v-mn)/(mx-mn))*118;

function barChart(id){const m=METRICS[id],s=m.s.slice(-8,-1),mx=Math.max(...s);

function compose(q){
 const lo=q.toLowerCase();
 const un=UNCERTIFIED.find(([k])=>lo.includes(k));
 if(un)return{deny:un};
 const hit=Object.entries(METRICS).filter(([id,m])=>m.k.some(k=>lo.includes(k)));
 if(!hit.length)return{deny:['that',"no certified metric in the registry matches this question"]};
 return{ids:hit.slice(0,3).map(h=>h[0])};}

function proposeField(){
 const q=document.getElementById('fldQ').value.trim();if(!q)return;
 const lo=q.toLowerCase();
 let t='text',opts='';
 if(/categor|type|group|status|select|option/.test(lo)){t='select';
  opts=/occupation/.test(lo)?'Agriculture, Daily wage, Household, Salaried, Other'
   :/educat/.test(lo)?'None, Primary, Secondary, Graduate'
   :/income/.test(lo)?'Below poverty line, Above poverty line':'Option A, Option B, Other';}
 else if(/date|dob|lmp|when/.test(lo))t='date';
 else if(/number|count|weight|height|score|age/.test(lo))t='number';
 else if(/phone|mobile|contact/.test(lo))t='phone';
 const label=(q.match(/(?:add|need|want|create)?\s*(?:an?\s+)?([a-z ]{3,24}?)(?:\s+(?:as|for|field|category|attribute|to)\b|$)/i)||[,'New field'])[1]
   .trim().replace(/^./,c=>c.toUpperCase());
 const key=label.toLowerCase().replace(/[^a-z]+/g,'_');
 pendingField={k:key,l:label,t,opts,req:false,core:false};
 document.getElementById('fldProp').innerHTML=`<div class="prop-card">
  <div class="pc-h">${svg('spark','i sm')}Proposed schema — unconfirmed</div>
  <div class="pc-r"><span>Label</span><b>${label}</b></div>
  <div class="pc-r"><span>Key</span><b>patient.${key}</b></div>
  <div class="pc-r"><span>Type</span><b>${t}</b></div>
  ${opts?`<div class="pc-r"><span>Options</span><b>${opts}</b></div>`:''}
  <div class="pc-r"><span>Required</span><b>false</b></div>
  <div class="pc-r"><span>Registry effect</span><b>patient.register v→ new</b></div>
  <div style="font-size:10.5px;color:var(--ink-3);line-height:1.5;margin:9px 0 11px">
   Adding a field creates a new version of the operation. Existing records keep the schema they were written against, so no back-fill and no silent nulls. The field appears in the rendered form and in the agent's tool surface simultaneously.</div>
  <div style="display:flex;gap:8px"><button class="btn btn-b" onclick="addField()">${svg('check','i sm')}Add to form</button>
   <button class="btn btn-g" onclick="document.getElementById('fldProp').innerHTML=''">Discard</button></div></div>`;}
function addField(){
 if(!pendingField)return;FIELDS.push(pendingField);pendingField=null;
 render();toast('Field added — patient.register versioned');}

/* ========== agent ========== */
function workspaceAsk(q){
 let t=S.threads.find(x=>!x.pid);
 if(!t){t={id:'t'+Date.now(),pid:null,title:'Workspace',msgs:[],up:Date.now()};S.threads.unshift(t);}
 t.up=Date.now();S.active=t.id;S.view='chat';
 t.msgs.push({who:'user',text:q,actor:ROLES[S.role].label,time:now()});
 render();setTimeout(()=>{t.msgs.push({who:'agent',...wsAnswer(q),time:now()});render();},450);}
function wsAnswer(q){
 const lo=q.toLowerCase(),today=PATIENTS.filter(p=>p.today);
 if(/queue|waiting|station|today/.test(lo))
  return{text:'Facility read across the registry. No writes performed.',
   kvs:Object.entries(STATIONS).filter(([k])=>k!=='done')
    .map(([k,l])=>[l,String(today.filter(p=>p.v.station===k).length)])};
 if(/abha|pending|unlinked/.test(lo)){const n=PATIENTS.filter(p=>!p.abha&&!p.v.abha);
  return{text:`<b>${n.length} patients</b> have no linked ABHA. They sit on the unlinked worklist and the agent surfaces the link at their next contact rather than blocking the queue.`,
   kvs:n.map(p=>[p.name,p.village])};}
 if(/stock|drug|medicine|metformin|reorder/.test(lo))
  return{text:'Pharmacy stock. Anything below reorder is surfaced at the point of prescribing, not at the counter.',
   kvs:STOCK.map(s=>[s.n,String(s.q),s.q<s.r?'crit':''])};
 if(/ncd|diabet|hypertens|cohort|overdue|follow/.test(lo)){const n=PATIENTS.filter(p=>p.cat==='NCD');
  return{text:`<b>${n.length} patients</b> in the NCD cohort at this facility. This is a read from certified metric definitions, not free-form SQL — two facilities computing this indicator get the same number.`,
   kvs:n.map(p=>[p.name,p.dx])};}
 return{text:`Read performed across the facility registry: ${PATIENTS.length} patients, ${today.length} in today's queue, ${S.threads.length} open threads. Reads are agentic and broad, so this produced no write. Try asking about the queue, pending ABHA, stock, or the NCD cohort.`};}

function askAgent(){
 const i=document.getElementById('ask'),q=i.value.trim();if(!q)return;i.value='';
 const t=T(),p=P();
 t.msgs.push({who:'user',text:q,actor:ROLES[S.role].label,time:now()});t.up=Date.now();render();
 if(p)p.v.audit.push({t:now(),op:'agent.read',by:ROLES[S.role].label});
 setTimeout(()=>{t.msgs.push(p
   ?{who:'agent',text:'Read performed across this patient\'s record: prior encounters, lab results, current medications. Reads are agentic and broad, so this produced no write. Anything I propose from here is rendered as an editable payload for you to confirm.',time:now()}
   :{who:'agent',...wsAnswer(q),time:now()});render();},450);}

 if(op&&p)p.v.audit.push({t:now(),op,by:ROLES[S.role].label});render();}

function openScribe(kind){
 const p=P();if(!p){toast('Open a patient first');return;}
 SC={...SC,open:true,live:false,tab:'transcript',kind,lines:[],note:null,t:0,i:0,
  tpl:kind==='visit'?'Household visit':'SOAP'};
 scRender();scCtl();}
function scClose(){SC.open=false;clearInterval(SC.timer);clearInterval(SC.stream);SC.live=false;scRender();scCtl();}
function scStart(){
 SC.live=true;SC.tab='transcript';SC.note=null;
 SC.timer=setInterval(()=>{SC.t++;scCtl();if(SC.open&&SC.tab==='transcript')
   document.querySelector('.sh-s').textContent=`${P().name} · recording ${String(Math.floor(SC.t/60)).padStart(2,'0')}:${String(SC.t%60).padStart(2,'0')}`;},1000);
 SC.stream=setInterval(()=>{
  const s=SCRIPTS[SC.kind];
  if(SC.i>=s.length){clearInterval(SC.stream);return;}
  SC.lines.push(s[SC.i++]);scRender();},1700);
 scRender();scCtl();}
function scStop(){
 clearInterval(SC.timer);clearInterval(SC.stream);SC.live=false;
 SC.note=genNote();SC.tab='note';scRender();scCtl();}

function genNote(){
 if(SC.kind==='visit')return{
  note:{en:`Household visit, ${P().name}.\n\nMedication exhausted ten days ago; not taking BP tablets. Reports giddiness and weakness. No chest pain reported.\n\nAdvised to attend the PHC tomorrow. Referral raised for medication refill and BP check.`,
   te:`గృహ సందర్శన, ${P().name}.\n\nపది రోజుల క్రితం మాత్రలు అయిపోయాయి; బీపీ మాత్రలు వేసుకోవడం లేదు. తల తిరగడం, నీరసం ఉన్నాయి.\n\nరేపు పీహెచ్‌సీకి రావాలని సూచించాం.`,
   hi:`गृह भ्रमण, ${P().name}.\n\nदस दिन पहले दवाइयाँ ख़त्म हो गईं; बीपी की गोलियाँ नहीं ले रहे हैं। चक्कर और कमज़ोरी।\n\nकल पीएचसी आने की सलाह दी गई।`},
  px:{te:`రేపు పీహెచ్‌సీకి రండి.\nమీ పాత మాత్రల చీటీ తీసుకురండి.\nఖాళీ కడుపుతో రావాల్సిన అవసరం లేదు.`,
   hi:`कल पीएचसी आइए।\nअपनी पुरानी पर्ची साथ लाइए।`,
   en:`Come to the PHC tomorrow.\nBring your old prescription.\nYou do not need to come fasting.`},
  kv:[['Outcome','Referred to PHC'],['Adherence','Lapsed 10 days'],['Sync','Queued offline']]};
 return{
  note:{en:`S: Headache and giddiness for two weeks. Known hypertensive, tablets exhausted ten days ago. Denies chest pain and breathlessness. Mother is diabetic.\n\nO: Recorded at the vitals station this visit.\n\nA: Essential hypertension, uncontrolled — adherence lapse. Family history of diabetes; screening indicated.\n\nP: Restart antihypertensive, adherence counselling, HbA1c, review in four weeks.`,
   te:`S: రెండు వారాలుగా తలనొప్పి, తల తిరగడం. బీపీ ఉన్నట్టు తెలుసు, పది రోజులుగా మాత్రలు లేవు. ఛాతీ నొప్పి లేదు. తల్లికి షుగర్ ఉంది.\n\nA: అదుపులో లేని రక్తపోటు — మాత్రలు ఆగిపోయాయి.\n\nP: మాత్రలు మళ్ళీ ప్రారంభించాలి, HbA1c పరీక్ష, నాలుగు వారాల్లో మళ్ళీ చూపించాలి.`,
   hi:`S: दो हफ़्ते से सिरदर्द और चक्कर। ज्ञात उच्च रक्तचाप, दस दिन से गोलियाँ नहीं। सीने में दर्द नहीं। माँ को मधुमेह।\n\nA: अनियंत्रित उच्च रक्तचाप — दवा में चूक।\n\nP: दवा पुनः शुरू, HbA1c, चार सप्ताह में समीक्षा।`},
  px:{te:`మాత్రలు ప్రతిరోజూ ఉదయం వేసుకోండి.\nమాత్రలు అయిపోయేలోపు పీహెచ్‌సీకి రండి.\nనాలుగు వారాల తర్వాత బీపీ చూపించండి.\nతల తిరిగితే వెంటనే రండి.`,
   hi:`गोली रोज़ सुबह लें।\nदवा ख़त्म होने से पहले पीएचसी आएँ।\nचार सप्ताह बाद बीपी दिखाएँ।`,
   en:`Take the tablet every morning.\nCome to the PHC before your tablets run out.\nHave your BP checked in four weeks.\nCome immediately if the giddiness returns.`},
  kv:[['Diagnosis','Essential hypertension, uncontrolled'],['Investigation','HbA1c'],
   ['Follow-up','4 weeks'],['Adherence','Lapsed 10 days']]};}

function scConfirm(){
 const p=P();
 if(SC.kind==='visit'){
  post({title:'Household visit recorded',ic:'home',tag:'queued offline',tagc:'b-warn',
   text:`Spoken in ${LANGS[SC.inLang].split(' ').pop()}, written in ${LANGS[SC.outLang].split(' ').pop()}, handout given in ${LANGS[SC.pxLang].split(' ').pop()}. Transcript retained so the translation can be checked.`,
   quote:SC.lines[1]?SC.lines[1][2]:''},'visit.household');
  toast('Visit confirmed — queued for sync');}
 else{
  p.v.consult=true;
  post({title:'Consultation documented',ic:'mic',tag:'draft → confirmed',tagc:'b-vio',
   kvs:SC.note.kv,
   text:`Spoken in ${LANGS[SC.inLang].split(' ').pop()}, note written in ${LANGS[SC.outLang].split(' ').pop()}, handout printed in ${LANGS[SC.pxLang].split(' ').pop()}. Only the confirmed payload entered the record; audio is now discarded.`,
   quote:'రెండు వారాలుగా తలనొప్పి, తల తిరుగుతోంది. — Headache and giddiness for two weeks.'},'encounter.document');
  toast('Note confirmed — prescribing unlocked');}
 scClose();}

function scCtl(){
 const el=document.getElementById('scCtl'),p=P(),c=ROLES[S.role].caps;
 const can=p&&(c.includes('encounter.document')||c.includes('visit.household'));
 if(!can){el.innerHTML='';return;}
 const mm=String(Math.floor(SC.t/60)).padStart(2,'0'),ss=String(SC.t%60).padStart(2,'0');
 el.innerHTML=SC.live
  ?`<button class="scbtn live" onclick="SC.open=true;scRender()">${svg('mic','i sm')}Transcribing<span class="t">${mm}:${ss}</span></button>`
  :SC.lines.length&&SC.open===false
   ?`<button class="scbtn" onclick="SC.open=true;scRender()">${svg('mic','i sm')}Resume session<span class="t">${mm}:${ss}</span></button>`
   :`<button class="scbtn" onclick="openScribe('${c.includes('visit.household')?'visit':'consult'}')">${svg('mic','i sm')}Start scribe</button>`;}

function joinTeam(){
 const p=P(),uid=ROLE_USER[S.role],u=PEOPLE.find(x=>x.id===uid);
 if(p.v.team.some(t=>t[0]===uid)){toast(`${u.name} is already in this care unit`);return;}
 const label={frontdesk:'Registration',nurse:'Vitals',mo:'Treating doctor',lab:'Lab',
  pharm:'Pharmacy',flw:'Community follow-up',admin:'Administration'}[S.role];
 modal({title:'Join care unit',
  sub:'The care unit is scoped to this episode, not to the facility tree. Membership is what grants visibility of this thread.',
  body:`<div class="warn-box">${svg('lock','i sm')}<span>Joining grants <b>${u.name}</b> read access to this patient's thread for the duration of the episode. It is logged and it expires when the episode closes.</span></div>
   <div class="field"><label>Person</label><input value="${u.name} · ${u.kind}" disabled></div>
   <div class="field"><label>Role in this episode</label><input value="${label}"></div>
   <div class="field"><label>Reason</label><select><option>Direct care</option><option>Second opinion</option><option>Handover cover</option></select></div>`,
  ok:'Join',
  run:()=>{p.v.team.push([uid,label]);
   post({title:`${u.name} joined the care unit`,ic:'users',tag:'access granted',tagc:'b-blue',
    text:`Role: ${label}. Care-unit membership is what makes this thread visible to them — not workspace membership, and not their department.`},'careunit.join');
   toast('Joined — access logged and episode-scoped');}});}

function regSet(k,v){REG[k]=v;regModal();}

function regModal(){
 if(REG.step==='abha')return modal({title:'Register patient',
  sub:'ABHA is the default path. Demographics come back verified from ABDM, which removes the transcription errors that create duplicates.',
  body:`<div class="sdk"><div class="sdk-h">${svg('id','i sm')}ABHA SDK · Eka ABDM Connect
     <span class="badge b-blue ml-auto">M1</span></div>
    <div class="sdk-tabs">
     ${[['aadhaar','Aadhaar OTP'],['mobile','Mobile OTP'],['existing','Existing ABHA']].map(([k,l])=>
      `<button class="sdk-tab ${REG.mode===k?'on':''}" onclick="regSet('mode','${k}')">${l}</button>`).join('')}</div>
    <div class="field" style="margin-top:13px"><label>${REG.mode==='existing'?'ABHA number or address':REG.mode==='mobile'?'Mobile number':'Aadhaar number'}</label>
     <input value="${REG.mode==='existing'?'':REG.mode==='mobile'?'98•••• 1102':'XXXX XXXX 4471'}"
      placeholder="${REG.mode==='existing'?'12-3456-7890-1234 or name@abdm':''}"></div>
    <div class="sdk-note">${svg('lock','i sm')}<span>Consent is taken inside the SDK in the patient's language. Eka never sees the Aadhaar number — only the ABHA token that comes back.</span></div></div>
   <button class="skip" onclick="regSet('step','manual')">
    ${svg('refer','i sm')}<span style="flex:1"><b>Register without ABHA</b>
    <div class="p-s">Patient declined, no mobile with them, or the counter is backed up. They are seen normally and the link returns to the worklist.</div></span></button>`,
  ok:'Send OTP',run:()=>regSet('step','otp')});

 if(REG.step==='otp')return modal({title:'Verify',
  sub:'One-time password sent to the Aadhaar-linked mobile ending 4471.',
  body:`<div class="sdk"><div class="sdk-h">${svg('id','i sm')}ABHA SDK · verification</div>
    <div class="field" style="margin-top:11px"><label>Enter OTP</label>
     <input value="••••••" style="letter-spacing:.4em;font-size:16px;text-align:center"></div>

 if(REG.step==='confirm')return modal({title:'Confirm registration',

    <div class="pc-r"><span>Name</span><b>Kotamma Bandi</b></div>
    <div class="pc-r"><span>ABHA</span><b>46-1122-3344-5566</b></div>
    <div class="pc-r"><span>Age / sex</span><b>47 · Female</b></div>
    <div class="pc-r"><span>Mobile</span><b>98•••• 1102</b></div>
    <div class="pc-r"><span>Address</span><b>Yadiki, Anantapur</b></div></div>
   <div class="warn-box">${svg('alert','i sm')}<span>ABHA address is the Aadhaar address and is often not current residence. Confirm the village with the patient before it drives ASHA attribution.</span></div>
   ${FIELDS.filter(f=>!['name','age','sex','phone'].includes(f.k)).map(f=>`<div class="field">
     <label>${f.l}${f.req?' *':''}</label>
     ${f.t==='select'?`<select>${(f.opts||'').split(',').map(o=>`<option>${o.trim()}</option>`).join('')}</select>`
      :`<input value="${f.k==='village'?'Yadiki':''}" placeholder="${f.l}">`}</div>`).join('')}
   <label class="chk"><input type="checkbox" id="cf"><span>Village confirmed with the patient, and they consent to this facility linking care contexts to their ABHA.</span></label>`,
  ok:'Confirm &amp; register',gate:'cf',
  run:()=>{const p={id:'pN'+PATIENTS.length,name:'Kotamma Bandi',init:'KB',age:47,sex:'F',village:'Yadiki',
    phone:'98•••• 1102',abha:'46-1122-3344-5566',last:'—',token:28,cat:'General',dx:'None recorded',

 modal({title:'Register without ABHA',
  sub:'Explicit fallback. The record is permanent and the confirm is un-prefilled.',
  body:`<div class="warn-box">${svg('alert','i sm')}<span><b>Irreversibility class.</b> A duplicate cannot be undone, only deprecated. Typed demographics are the main source of duplicates, which is why ABHA is the default path.</span></div>
   ${FIELDS.map(f=>`<div class="field"><label>${f.l}${f.req?' *':''}</label>
     ${f.t==='select'?`<select>${(f.opts||'').split(',').map(o=>`<option>${o.trim()}</option>`).join('')}</select>`
      :`<input value="${{name:'Kotamma B',age:'47',phone:'98•••• 1102',village:'Yadiki'}[f.k]||''}" placeholder="${f.l}">`}</div>`).join('')}
   <button class="skip" onclick="regSet('step','abha')">${svg('id','i sm')}
    <span style="flex:1"><b>Go back and try ABHA</b>
    <div class="p-s">Verified demographics, no transcription risk, no worklist follow-up.</div></span></button>
   <label class="chk"><input type="checkbox" id="cf"><span>I have searched and confirmed no existing record matches this patient.</span></label>`,
  ok:'Confirm &amp; register',gate:'cf',
  run:()=>{const p={id:'pN'+PATIENTS.length,name:'Kotamma B',init:'KB',age:47,sex:'F',village:'Yadiki',
    phone:'98•••• 1102',abha:null,last:'—',token:28,cat:'General',dx:'None recorded',
    meds:'None',alerts:'New registration',today:true,v:V()};
   PATIENTS.push(p);openPatient(p.id);
   post({title:'Patient registered',ic:'plus',tag:'ABHA pending',tagc:'b-warn',
    text:'Registered without ABHA. Added to the unlinked worklist — the agent surfaces the link at next contact rather than blocking the queue.'},'patient.register');
   toast('Registered · ABHA deferred to worklist');}});}

/* ========== modal ========== */
let _run=null;
function modal({title,sub,body,ok,gate,run}){
 _run=run;
 document.getElementById('mod').innerHTML=`<div class="mod-bar"></div>
  <div class="mod-h"><div class="mod-t">${title}</div><div class="mod-s">${sub}</div></div>
  <div class="mod-b">${body}</div>
  <div class="mod-f"><span style="font-size:10.5px;color:var(--gray-400);flex:1;line-height:1.4">Actor, surface, payload and outcome are written to the audit log.</span>
   <button class="btn btn-g" onclick="closeModal()">Cancel</button>
   <button class="btn btn-b" id="okBtn" ${gate?'disabled':''} onclick="commit()">${ok}</button></div>`;
 if(gate)document.getElementById(gate).addEventListener('change',e=>{
  document.getElementById('okBtn').disabled=!e.target.checked;});
 document.getElementById('modOv').classList.add('show');}
function closeModal(){document.getElementById('modOv').classList.remove('show');_run=null;}
function commit(){const r=_run;closeModal();if(r)r();}

document.addEventListener('keydown',e=>{
 const sp=document.getElementById('spotOv').classList.contains('show');
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSpot();return;}
 if(e.key==='Escape'){closeSpot();closeModal();if(SC.open&&!SC.live)scClose();return;}
 if(!sp)return;
 const R=rows();if(!R.length)return;
 if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%R.length;renderSpot();}
 if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+R.length)%R.length;renderSpot();}
 if(e.key==='Enter'){e.preventDefault();runRow(sel);}});

S.view='home';render();
setTimeout(()=>toast('⌘K to search or ask · switch role at the bottom of the sidebar'),700);
</script>
