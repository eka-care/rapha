# The primary health centre bundle. Load this and the kernel is a PHC.
#
# Operations are referenced by id and live in catalogue/ops, because they are
# shared vocabulary; a dental bundle would reference some of the same atoms.
# Everything else listed here lives beside this file, including this facility's
# own vocabulary: its stations, its state flags, its capabilities and its role
# bundles. They were in catalogue/vocab.py until the laboratory had to borrow
# them, and closure is now checked per bundle: a phc.* declaration may name
# what is below and nothing else.
id: phc
version: 2026.09.10
title: Primary health centre
operations:
  - phc.op.patient-register
  - phc.op.abha-link
  - phc.op.vitals-record
  - phc.op.consult-document
  - phc.op.rx-prescribe
  - phc.op.lab-order
  - phc.op.lab-result-enter
  - phc.op.pharmacy-dispense
  - phc.op.household-visit
  - phc.op.handover
  - phc.op.handover-reply
  # The pregnancy: the level between a person and a visit. See
  # docs/superpowers/specs/2026-11-04-maternal-and-child-health-design.md
  - phc.op.pregnancy-open
  - phc.op.pregnancy-close
  - phc.op.risk-mark
  - phc.op.delivery-record
  - phc.op.delivery-record-high-risk
  - phc.op.pregnancy-close-high-risk
  - phc.op.postnatal-close
  - phc.op.postnatal-visit
  - phc.op.postnatal-outcome
  - phc.op.referral-raise
  - phc.op.referral-close
  - phc.op.context-add
  # Generated from the `templates` declaration below.
  - phc.op.ncd-review
  - phc.op.antenatal-visit
  - phc.op.antenatal-measure
  - phc.op.followup
workflows:
  - phc.wf.outpatient
views:
  - phc.view.station-queue
  - phc.view.visit-summary
  - phc.view.facility-dashboard
  - phc.view.today-tasks
  - phc.view.calendar
instruments:
  - phc.inst.vitals-voice
  - phc.inst.vitals-device
  - phc.inst.consult-scribe
  # Reads a photographed report into the outside-record form. An accelerator
  # over that form, never a gate on it: the three fields stay typeable.
  - phc.inst.context-scan
# What this centre owes somebody over the life of one episode. A schedule is
# a clinical protocol and carries its own sign off; see the atom.
schedules:
  - phc.sched.antenatal
  - phc.sched.antenatal-high-risk
  - phc.sched.postnatal
  - phc.sched.postnatal-high-risk
  - phc.sched.referral
metrics:
  - phc.metric.visits
  - phc.metric.abha-coverage
  - phc.metric.vitals-flagged-rate

# The line, in order. A station is a place a person stands, and these are a
# primary health centre's.
stations: [reception, nurse, doctor, lab, pharmacy, community]

# Which template a recording fills at each station. A template is an operation:
# its questionnaire is the form, and its mapping is the only way anything
# heard reaches a row. `choose` is what the bar's switcher offers; every id
# must be in the scribe instrument's operations. `default: null` means the
# person picks, which is the community worker's case: several surveys, none
# of them obviously first.
#
# `note` names the Eka library template a recording at this station is also
# written up in, by its title in the workspace's library, unless the person
# turns it off. It is optional and a recording needs none. The nurse and the
# doctor name the same one on purpose: what the doctor opens is ONE note with
# the nurse's part already in it, each under their own name.
#
# `nudges` are what the screen SHOWS somebody who has pressed record and does
# not know what to say. They are examples, not a form and not a limit: the
# microphone takes whatever is said, and a visit that needs a fourth reading
# or a finding nobody listed is recorded the same way. The field names come
# from Eka's own scribe taxonomy, so a note recorded here lands in the same
# parts of the record a note recorded in Eka does.
#
# They are declared here, and not typed into the screen, for the reason
# everything else is: a sentence a clinician reads beside a patient is part
# of this facility's record of how it works. A centre that wants different
# examples edits them from the control panel and the screen follows.
scribe:
  reception:
    default: phc.op.patient-register
    choose: [phc.op.patient-register]
    nudges:
      - {field: Name,    say: "Her name is Sunita Devi, she is thirty two."}
      - {field: Mobile,  say: "Mobile nine eight four one two three four five six."}
      - {field: Village, say: "She has come from Barkagaon."}
      - {field: ABHA,    say: "She already has an ABHA number."}
  nurse:
    default: phc.op.vitals-record
    choose: [phc.op.vitals-record]
    note: Default Prescription Print
    nudges:
      - {field: Vitals,   say: "BP one twenty over eighty, pulse eighty four."}
      - {field: Vitals,   say: "Temperature ninety nine point four, weight fifty one kilos."}
      - {field: Symptoms, say: "Fever since three days, and a cough at night."}
      - {field: Triage,   say: "She is breathless, send her in first."}
  doctor:
    default: phc.op.consult-document
    choose: [phc.op.consult-document, phc.op.ncd-review,
             phc.op.antenatal-visit, phc.op.followup,
             phc.op.rx-prescribe]
    note: Default Prescription Print
    nudges:
      - {field: Symptoms,        say: "Burning when she passes urine, four days now."}
      - {field: Medical history, say: "Diabetic for six years, on metformin."}
      - {field: Examination,     say: "Chest is clear, no tenderness in the abdomen."}
      - {field: Diagnosis,       say: "This looks like a urinary tract infection."}
      - {field: Medications,     say: "Nitrofurantoin hundred milligrams, twice a day, five days."}
      - {field: Investigations,  say: "Send a urine routine and a blood sugar."}
      - {field: Advice,          say: "Plenty of water, and come back if the fever climbs."}
      - {field: Follow up,       say: "Review her in one week."}
      - {field: Referral,        say: "Refer her to the district hospital for a scan."}
  community:
    default: null
    choose: [phc.op.household-visit]
    nudges:
      - {field: Household, say: "Five people in the house, two under five."}
      - {field: Members,   say: "The youngest has not had her measles dose."}
      - {field: Findings,  say: "There is standing water behind the house."}

# What this facility publishes to ABDM, and what it files under which of the
# profile's own section slices. ABDM names the slices and fixes their codes
# (kernel/fhir.py PROFILES); this says what a primary health centre files
# under each one.
#
# It is declared here rather than passed in by whoever asks for a document,
# because a placement typed at the call site is a placement typed once per
# caller: a diagnosis went under Chief complaints in one check and under
# Medical History in another, which is the same visit filed two ways. A
# heading is a fact about this facility's record, so it is written once.
#
# `resource` is a table name, and every one must have a FHIR projection and
# be written by an operation this bundle loads. Both are linted in
# kernel/declarations.py.
#
# Three of the OPConsultRecord's twelve slices are filled and nine are not.
# Each omission is a missing resource or a missing code rather than a
# shortcut, and they are listed in the plan: Allergies needs an
# AllergyIntolerance, InvestigationAdvice and Referral need a ServiceRequest,
# FollowUp needs an Appointment, Procedure needs a Procedure, and
# PhysicalExamination, FamilyHistory and OtherObservations have no published
# section code anywhere this build could read. A slice is min 0, so omitting
# it is valid; emitting one under a guessed code is not.
documents:
  consultation:
    profile: OPConsultRecord
    sections:
      # Every coded diagnosis, whatever its clinical status. This build cannot
      # tell a presenting complaint from a past condition: the consultation
      # form asks for a diagnosis and not for which heading it belongs under,
      # and MedicalHistory takes a Condition too. Splitting them on the
      # clinical status code would file four of that value set's six statuses
      # nowhere at all, so they stay in one section until somebody asks the
      # question on the form. Named in the plan as a decision.
      ChiefComplaints: [{resource: condition}]
      Medications: [{resource: medication_request}]
      # The narrative, which for most consultations is the whole record: only
      # three conditions and six medicines can be coded here.
      DocumentReference: [{resource: notes}]

# The doctor's templates. A clinician does not want the general consultation
# form for every patient, and a template is how this bundle says so.
#
# A template is NOT a new questionnaire and NOT a fifth declaration type. The
# `scribe` key above already says what a template is: an operation, whose
# questionnaire is the form and whose mapping is the only way anything heard
# reaches a row. So each entry below names one operation it narrows (`of`) and
# the ordered subset of that form's own questions it asks. From that,
# kernel/templates.py GENERATES the operation atom and the questionnaire, with
# the base's own bindings, mapping sources, capability, station,
# preconditions, instrument, emits and surfaces. Three hand written forms
# would be three more files to keep in step with every value set and every
# mapping; a generated one cannot drift, because the gate holds what is on
# disk against this declaration.
#
# Nothing clinical is declared here. No condition, no medicine, no value set,
# no review interval, no antenatal schedule, no threshold. The only thing a
# template says is which of the questions the general consultation already
# asks this kind of visit puts in front of a clinician.
#
# WHICH questions each visit type should ask is a clinical and product
# decision that has not been made. The narrowings below are provisional and
# each one carries its own `sign_off` sentence saying so, for the same reason
# terminology/condition-code.json carries a banner: content without a named
# clinician's sign-off must not be read as clinical guidance. The one
# narrowing that is NOT a clinical judgement is the antenatal visit's, and it
# is a fact about this build's vocabulary rather than about obstetrics.
templates:
  phc.op.ncd-review:
    of: phc.op.consult-document
    short: NCD review
    title: Review a long term condition
    summary: A review visit for a condition already being treated.
    asks: [history, examination, assessment, diagnosis, plan]
    require: [examination]
    plain: |
      A review of a condition somebody is already being treated for. It asks
      the same five things the general consultation asks, and it will not
      commit without what you found on examination, because a review whose
      measurements are missing is a visit nobody can compare the next one to.
    sign_off: |
      NEEDS SIGN-OFF. That the examination is required here, rather than
      optional as it is on the general consultation, is a product choice made
      without a clinician. It states no interval, no target and no threshold,
      and it must not be read as a review protocol. A named clinical officer
      has to confirm it before this template is offered to anybody.
  phc.op.antenatal-visit:
    of: phc.op.consult-document
    short: Antenatal
    title: Antenatal visit
    summary: An antenatal visit, recorded as narrative.
    asks: [history, examination, assessment, plan]
    plain: |
      An antenatal visit. It asks for the history, what you found, your
      assessment and the plan, and it does not offer the coded diagnosis
      rows, because this build can code three conditions and not one of them
      is obstetric. The whole of this visit travels as narrative text into
      the published document, which is what that fallback was built for.
    sign_off: |
      This narrowing is a fact about this build's vocabulary and not a
      clinical judgement: terminology/condition-code.json holds three
      concepts and says it is not a diagnosis list, so there is no obstetric
      concept for a coded row to carry. It follows that this template codes
      NOTHING. It is not clinically useful as a coded record until a
      published obstetric list is signed off by a named clinical officer, and
      it should not be mistaken for one. What it does do is keep the visit as
      text in a record that reaches ABDM.
  phc.op.followup:
    of: phc.op.consult-document
    short: Follow up
    title: Follow up visit
    summary: A return visit about something already recorded.
    asks: [history, assessment, diagnosis, plan]
    plain: |
      A return visit about something already recorded. It asks what has
      happened since, your assessment, the conditions this visit is about and
      the plan. It does not ask for an examination, on the view that a return
      visit is usually about what changed rather than about a fresh set of
      findings.
    sign_off: |
      NEEDS SIGN-OFF. Leaving the examination off this form is a product
      choice made without a clinician, and a follow up that does need an
      examination has nowhere to put it on this template. The general
      consultation asks all five questions and is the answer until a named
      clinical officer confirms this narrowing or replaces it.

# Thread state flags. Derived from CARE resources where CARE knows the answer;
# stored on the thread only where it does not. phc.wf.outpatient must declare a
# rule for every one of these and for nothing else.
states:
  - registered
  - abha.linked
  - abha.pending
  - vitals.recorded
  - vitals.flagged
  - consult.documented
  - handover.raised
  - rx.confirmed
  - lab.ordered
  - lab.resulted
  - lab.validated
  - lab.critical
  - dispensed.partial
  - dispensed.complete
  - followup.booked
  # A pregnancy this centre is following. Derived from the episode rows and
  # never stored: `pregnancy.ended` is the count of endings against the
  # count of openings, exactly as `dispensed.complete` is, and
  # `pregnancy.open` is an opening with no ending yet.
  - pregnancy.open
  - pregnancy.ended
  - pregnancy_high_risk.open
  - pregnancy_high_risk.ended
  - pregnancy.ordinary
  # The six weeks after a delivery. Derived from the same pair of episode
  # rows a pregnancy is, and opened by one operation only: recording a
  # delivery. A pregnancy that ended any other way never acquires one.
  - postnatal.open
  - postnatal.ended
  - postnatal_high_risk.open
  - postnatal_high_risk.ended
  # A referral this centre has not heard the end of. Derived from the same
  # pair of episode rows a pregnancy is, because a referral IS an episode:
  # it starts, it is owed, and it ends with an outcome.
  - referral.open
  - referral.ended

# What a person may do here. An atom naming anything else fails the per bundle
# closure check in kernel/declarations.py.
# addendum SSC. `handover` is the prototype's; it is a real operation, not a role.
#
# A capability carries its own `title:`, which is the words a person reads for
# it. The shape is `plugins:` below: an id, and the bundle's own word for it.
# A bundle may still write a plain list of ids, which is what bundles/lab
# does, and then nothing declares a name and every reader falls back to what
# it fell back to before. Mixing the two inside one bundle is refused:
# kernel/declarations.py fails a mapping entry whose title is missing, in the
# same sentence `plugins:` already fails under.
#
# WHY A CAPABILITY DECLARES ITS NAME RATHER THAN BORROWING ONE. The roles
# control panel used to derive a switch's label from whichever declarations
# named the capability: one operation lent its title, several lent their
# `short`s joined with a dot, and a capability no operation named borrowed a
# view's title instead. That is not a rule, it is an accident of how many
# declarations happen to name a word. It printed `assessment.record` and three
# others raw, because nothing named them; it printed "Lines, Needs you, Visit
# summary" for `patient.find` and five screens joined for
# `encounter.document`, because too much did. Both failures are the same
# failure. A capability is a declaration in its own right, so the name is the
# declaration's to give, and adding an operation can no longer rewrite it.
capabilities:
  patient.find:         {title: Find a patient}
  patient.register:     {title: Register a new patient}
  abha.link:            {title: Create or link an ABHA}
  vitals.record:        {title: Record vitals and triage}
  assessment.record:    {title: Record an assessment}
  encounter.document:   {title: Document a consultation}
  rx.prescribe:         {title: Write a prescription}
  lab.order:            {title: Order an investigation}
  lab.result.enter:     {title: Enter a laboratory result}
  lab.result.validate:  {title: Validate a laboratory result}
  pharmacy.dispense:    {title: Dispense a prescription}
  visit.household:      {title: Record a household visit}
  appointment.book:     {title: Book an appointment}
  episode.manage:       {title: Open or close a pregnancy}
  handover:             {title: Hand over to a colleague}
  context.record:       {title: Add background from elsewhere}
  facility.admin:       {title: Administer this centre}
  reporting.view:       {title: Read this centre's numbers}

# Role bundles. Default bundles ship as CARE roles with is_system=True. A
# facility's own combination is an is_system=False role in the DB, which CARE's
# sync_permissions_roles command deliberately does not touch.
#
# A role carries its own `title:` beside its capabilities, which is again the
# shape `plugins:` uses, and for the same reason: a role id is a machine name,
# and the picker in the control panel could only case it, so it offered "Anm"
# and "Mo" where a person expects the name of a job. These titles are the
# standard job names in an Indian primary health centre. ASHA and ANM are
# initialisms and stay upper case.
#
# A plain `role: [capabilities]` is still valid, which is what bundles/lab
# writes, and a bundle that writes it declares no name.
roles:
  frontdesk:
    # THE REGISTER AND NOTHING ELSE, by the owner's decision of 4 November
    # 2026. A clerk at the counter finds a person, registers one, links an
    # ABHA and books a return: that is the whole of the module this seat is
    # for, and every capability beyond it was a door nobody at this desk is
    # meant to open. Two were removed to get here.
    #
    # `context.record` went because copying another facility's discharge
    # summary into a patient's record is filing clinical paper, and the
    # person who decides what that paper means is the one who should file
    # it. The nurse and the medical officer still hold it.
    #
    # `handover` went because it is the narrower loss of the two and is the
    # one to put back first if the counter turns out to need a way to say
    # "this one looks very unwell" to the bench. Today it would be the only
    # thing a clerk could do that is not registration.
    title: Front desk
    capabilities: [patient.find, patient.register, abha.link, appointment.book]
  nurse:
    title: Staff nurse
    capabilities: [patient.find, patient.register, abha.link, appointment.book,
                   vitals.record, assessment.record, context.record, handover,
                   episode.manage]
  mo:
    title: Medical officer
    capabilities: [patient.find, encounter.document, rx.prescribe, lab.order,
                   assessment.record, reporting.view, context.record, handover,
                   episode.manage]
  lab:
    title: Laboratory technician
    capabilities: [patient.find, lab.result.enter, handover]
  lab_incharge:
    title: Laboratory in charge
    capabilities: [patient.find, lab.result.enter, lab.result.validate, handover]
  pharmacist:
    title: Pharmacist
    capabilities: [patient.find, pharmacy.dispense, handover]
  asha:
    title: ASHA
    capabilities: [patient.find, patient.register, abha.link, visit.household,
                   assessment.record, appointment.book]
  anm:
    title: ANM
    # `encounter.document` is here BY THE OWNER'S DECISION, recorded on 4
    # November 2026, and it is a scope of practice decision rather than a
    # technical one. An ANM runs antenatal care at a sub-centre, so a
    # schedule that assigns her an antenatal contact and a product that
    # will not let her record it cannot both be right. The cost is that it
    # also lets her document any consultation, because the antenatal visit
    # is a template of the general one and shares its capability. Giving
    # the antenatal visit a capability of its own is still the smaller,
    # narrower change and remains available; see
    # bundles/phc/phc.sched.antenatal.md.
    capabilities: [patient.find, patient.register, abha.link, visit.household,
                   assessment.record, appointment.book, vitals.record,
                   encounter.document, episode.manage]
  cho:
    title: Community health officer
    capabilities: [patient.find, patient.register, abha.link, visit.household,
                   assessment.record, appointment.book, vitals.record,
                   encounter.document, lab.order, rx.prescribe, episode.manage]

# --------------------------------------------------------------------------
# A facility's shape
# --------------------------------------------------------------------------
#
# Primary health centres differ. One has a laboratory and one does not. Making
# a centre's copy different used to mean editing this bundle, which is a fork,
# and a fork means every later change has to be applied twice. These two keys
# make the difference a choice recorded in one place instead.
#
# A plugin is a NAMED GROUP OF THIS BUNDLE'S OWN WORDS, exactly as `roles:`
# above is. It is not a sixth declaration type, for the reason the spine and
# plugins spec gives: a grouping of ids costs nothing, and a declaration type
# costs a manifest entry, a lint pass, a dataclass, a compiled key, a Go
# struct and a renderer type.
#
# A plugin that is off is a capability the caller does not hold. That is the
# whole mechanism, and kernel/plugins.py says why it is the only one available:
# the renderer may never name a capability, so switching the laboratory off
# cannot be a condition in a screen, and a second bundle file would be the
# fork this exists to avoid. The capability set is the one per caller set the
# guard, `visible()`, the quick action row, `GET /whoami`, `GET /views/{id}`
# and the MCP server's tool list all already read.
#
# A capability no plugin claims is always on. That is the default on rule: a
# plugin added here later cannot quietly take an ability away from a centre
# that never heard of it.
#
# `always: true` is the floor a facility may not switch off.
plugins:
  baseline:
    title: The line itself
    always: true
    capabilities: [patient.find, patient.register, abha.link, vitals.record,
                   assessment.record, encounter.document, appointment.book,
                   handover, facility.admin, episode.manage]
  prescriptions:
    title: Prescribing and dispensing
    capabilities: [rx.prescribe, pharmacy.dispense]
  orders:
    title: Laboratory orders and results
    capabilities: [lab.order, lab.result.enter, lab.result.validate]
  outreach:
    title: Household visits
    capabilities: [visit.household]
  reporting:
    title: The facility's own numbers
    capabilities: [reporting.view]

# Which shape this build runs. PHC_FACILITY overrides it, read exactly where
# PHC_BUNDLE is read and for the same reason: one kernel serves one facility.
facility: all-plugins

# The shapes this bundle ships, each one a list of what that centre does NOT
# run. There is no `on` list: a positive one would mean a plugin added later
# ships off everywhere and nobody notices until a clinician cannot work.
#
# The key is `without`. It was written as `off` first, which is what the spec
# wrote: YAML 1.1 reads a bare off as the boolean false, so that spelling
# parses as a key named False and the declaration silently describes nothing.
# kernel/plugins.py refuses it by name rather than as an unknown key.
#
# These ids describe which of the plugins above a centre runs. They are NOT
# facility types from the national health facility registry, and nothing here
# should be read as a claim about how India's primary care is organised. A
# real deployment declares its own and names them after its own centres.
facilities:
  all-plugins:
    title: Every plugin this bundle ships
    without: []
    # WHO COVERS THIS PATIENT, looked up rather than stored on them. An
    # Indian PHC covers about 30,000 people through sub-centres of about
    # 5,000, each with an ANM, and an ASHA covers roughly 1,000 within a
    # habitation. So a patient's village already implies their sub-centre,
    # their ANM and their ASHA: the clerk types one thing and the other
    # three are read off this, never retyped and never asked for.
    #
    # `column` is which of the subject's own columns names the habitation.
    # The screen is told that and nothing else: it looks the value up and
    # draws what it finds, and a centre that renames the column or declares
    # no catchment at all changes this file and no code.
    #
    # THESE NAMES ARE THIS DEMO'S, not a real register. A deployment
    # declares its own sub-centres and its own workers.
    catchment:
      column: village
      areas:
        - area: SC Yadiki
          anm: B. Jyothi
          villages:
            Yadiki: G. Saroja
            Sonpur: M. Anjali
        - area: SC Bhagwanpur
          anm: P. Lalitha
          villages:
            Bhagwanpur: T. Bhagya
            Kottala: R. Devi
        - area: SC Tadpatri East
          anm: K. Suneetha
          villages:
            Tadpatri: ""        # nobody assigned, and the screen says so
  no-laboratory:
    title: A centre with no laboratory
    without: [orders]
  consulting-room-only:
    title: A consulting room, with no laboratory and no outreach
    without: [orders, outreach, reporting]
