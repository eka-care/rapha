# The primary health centre bundle. Load this and the kernel is a PHC.
#
# Operations are referenced by id and live in catalogue/ops, because they are
# shared vocabulary; a dental bundle would reference some of the same atoms.
# Everything else listed here lives beside this file, including this facility's
# own vocabulary: its stations, its state flags, its capabilities and its role
# bundles. They were in catalogue/vocab.py until the laboratory had to borrow
# them, and closure is now checked per bundle: a phc.* declaration may name
# what is below and nothing else.
id: phc
version: 2026.09.10
title: Primary health centre
operations:
  - phc.op.patient-register
  - phc.op.abha-link
  - phc.op.vitals-record
  - phc.op.consult-document
  - phc.op.capture-withdraw
  - phc.op.rx-prescribe
  - phc.op.lab-order
  - phc.op.lab-result-enter
  - phc.op.pharmacy-dispense
  - phc.op.household-visit
  - phc.op.handover
  - phc.op.handover-reply
workflows:
  - phc.wf.outpatient
views:
  - phc.view.station-queue
  - phc.view.visit-summary
  - phc.view.facility-dashboard
  - phc.view.today-tasks
instruments:
  - phc.inst.vitals-voice
  - phc.inst.vitals-device
  - phc.inst.consult-scribe
  - phc.inst.consent-speak
metrics:
  - phc.metric.visits
  - phc.metric.abha-coverage
  - phc.metric.vitals-flagged-rate

# The line, in order. A station is a place a person stands, and these are a
# primary health centre's.
stations: [reception, nurse, doctor, lab, pharmacy, community]

# Which template a recording fills at each station. A template is an operation:
# its questionnaire is the form, and its mapping is the only way anything
# heard reaches a row. `choose` is what the bar's switcher offers; every id
# must be in the scribe instrument's operations. `default: null` means the
# person picks, which is the community worker's case: several surveys, none
# of them obviously first.
scribe:
  reception: {default: phc.op.patient-register, choose: [phc.op.patient-register]}
  nurse:     {default: phc.op.vitals-record,    choose: [phc.op.vitals-record]}
  doctor:    {default: phc.op.consult-document, choose: [phc.op.consult-document, phc.op.rx-prescribe]}
  community: {default: null,                    choose: [phc.op.household-visit]}

# What this facility publishes to ABDM, and what it files under which of the
# profile's own section slices. ABDM names the slices and fixes their codes
# (kernel/fhir.py PROFILES); this says what a primary health centre files
# under each one.
#
# It is declared here rather than passed in by whoever asks for a document,
# because a placement typed at the call site is a placement typed once per
# caller: a diagnosis went under Chief complaints in one check and under
# Medical History in another, which is the same visit filed two ways. A
# heading is a fact about this facility's record, so it is written once.
#
# `resource` is a table name, and every one must have a FHIR projection and
# be written by an operation this bundle loads. Both are linted in
# kernel/declarations.py.
#
# Three of the OPConsultRecord's twelve slices are filled and nine are not.
# Each omission is a missing resource or a missing code rather than a
# shortcut, and they are listed in the plan: Allergies needs an
# AllergyIntolerance, InvestigationAdvice and Referral need a ServiceRequest,
# FollowUp needs an Appointment, Procedure needs a Procedure, and
# PhysicalExamination, FamilyHistory and OtherObservations have no published
# section code anywhere this build could read. A slice is min 0, so omitting
# it is valid; emitting one under a guessed code is not.
documents:
  consultation:
    profile: OPConsultRecord
    sections:
      # Every coded diagnosis, whatever its clinical status. This build cannot
      # tell a presenting complaint from a past condition: the consultation
      # form asks for a diagnosis and not for which heading it belongs under,
      # and MedicalHistory takes a Condition too. Splitting them on the
      # clinical status code would file four of that value set's six statuses
      # nowhere at all, so they stay in one section until somebody asks the
      # question on the form. Named in the plan as a decision.
      ChiefComplaints: [{resource: condition}]
      Medications: [{resource: medication_request}]
      # The narrative, which for most consultations is the whole record: only
      # three conditions and six medicines can be coded here.
      DocumentReference: [{resource: notes}]

# Thread state flags. Derived from CARE resources where CARE knows the answer;
# stored on the thread only where it does not. phc.wf.outpatient must declare a
# rule for every one of these and for nothing else.
states:
  - registered
  - abha.linked
  - abha.pending
  - capture.agreed
  - capture.declined
  - capture.withdrawn
  - capture.consented
  - vitals.recorded
  - vitals.flagged
  - consult.documented
  - handover.raised
  - rx.confirmed
  - lab.ordered
  - lab.resulted
  - lab.validated
  - lab.critical
  - dispensed.partial
  - dispensed.complete
  - followup.booked

# What a person may do here. An atom naming anything else fails the per bundle
# closure check in kernel/declarations.py.
# addendum SSC. `handover` is the prototype's; it is a real operation, not a role.
capabilities:
  - patient.find
  - patient.register
  - abha.link
  - vitals.record
  - assessment.record
  - encounter.document
  - rx.prescribe
  - lab.order
  - lab.result.enter
  - lab.result.validate
  - pharmacy.dispense
  - visit.household
  - appointment.book
  - handover
  - facility.admin
  - reporting.view

# Role bundles. Default bundles ship as CARE roles with is_system=True. A
# facility's own combination is an is_system=False role in the DB, which CARE's
# sync_permissions_roles command deliberately does not touch.
roles:
  frontdesk: [patient.find, patient.register, abha.link, appointment.book, handover]
  nurse: [patient.find, patient.register, abha.link, appointment.book,
          vitals.record, assessment.record, handover]
  mo: [patient.find, encounter.document, rx.prescribe, lab.order,
       assessment.record, reporting.view, handover]
  lab: [patient.find, lab.result.enter, handover]
  lab_incharge: [patient.find, lab.result.enter, lab.result.validate, handover]
  pharmacist: [patient.find, pharmacy.dispense, handover]
  asha: [patient.find, patient.register, abha.link, visit.household,
         assessment.record, appointment.book]
  anm: [patient.find, patient.register, abha.link, visit.household,
        assessment.record, appointment.book, vitals.record]
  cho: [patient.find, patient.register, abha.link, visit.household,
        assessment.record, appointment.book, vitals.record,
        encounter.document, lab.order, rx.prescribe]
