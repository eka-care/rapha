# The primary health centre's own demo day. Declared data, not Python.
#
# This was adapters/local/store.py SEED_PEOPLE until 2026.09.13, where it ran
# under whatever bundle was loaded, so a laboratory opened on six outpatients
# with prefixed tokens and a pending Amoxicillin. A seed belongs to the
# facility whose words it speaks, so it lives here. A bundle that declares no
# seed starts empty, which is a supported outcome and not a crash.
#
# The tokens are ONE SEQUENCE, numeric, in arrival order, and they ascend with
# the clock: whoever has been here longest holds the lowest number. Both ways
# in draw from it. Two of these six registered themselves at the poster by the
# door and the desk never met them, and they are numbers 4 and 5 of the same
# six rather than a series of their own, because a waiting room is one room.
# The seed shipped A01 to A06 until 2026.11.01, which is where the renderer's
# idea of a token came from.
#
# Six people standing at six points of phc.wf.outpatient, so no screen is
# empty: reception, nurse, doctor, lab, pharmacy, and one finished line.
#
# Shape, linted by kernel/declarations.py:
#   id       the thread, which is an encounter row
#   token    what is called out in the waiting area: this facility's day
#            sequence, issued at arrival by kernel/tokens.py
#   arrival  the provenance mark a view declares, for somebody who registered
#            themselves rather than being registered at the desk. Absent is
#            the ordinary way in, so there is no word here for the desk
#   status   the encounter's own status; "completed" closes it at reception
#   patient  one patient row, joined to the thread by the adapter
#   rows     one row each, `resource` plus that table's columns, in order
#   flags    stored thread flags; must be this bundle's declared states
#   proposals  a write awaiting a person; the operation must be one this
#              bundle loads, which is what stops a PHC prescription from
#              being offered on a laboratory thread
#   minutes_ago  backdates only this thread's own opened_at, so the wait
#                rule (target_minutes: 30 on this bundle's queue view) has a
#                seeded row actually past its declared threshold; every
#                other thread shares the seed's single "now" stamp
threads:
  # Walked in, not registered. Stands at reception with no patient row at all,
  # and holds the newest number because he is the one who just arrived.
  - id: enc-001
    token: "6"
    status: in_progress

  # Registered, waiting for the nurse -- and has been for 45 minutes, past
  # this bundle's own 30 minute target, so the wait rule always has one row
  # to actually ink on a fresh seed.
  - id: enc-002
    token: "1"
    status: in_progress
    minutes_ago: 45
    patient: {operation: phc.op.patient-register, name: Kamala Devi, age: 34, sex: female, phone: "9800000002",
              village: Sonpur, category: anc}
    audit:
      - operation: phc.op.patient-register
        actor: "user:frontdesk"
        payload: {name: Kamala Devi, age: 34, sex: female, phone: "9800000002",
                  village: Sonpur, category: anc}

  # Vitals taken and the blood pressure is high. Stands at the doctor.
  # Registered himself at the poster: he carries a national account already,
  # so his profile came from his own application and no clerk typed a word of
  # it. There is no abha-link line in his audit for the same reason.
  - id: enc-003
    token: "5"
    status: in_progress
    arrival: poster
    patient: {operation: phc.op.patient-register, name: Ramesh Kumar, age: 61, sex: male, phone: "9800000003",
              village: Bhagwanpur, category: ncd,
              abha_number: "12-3456-7890-1234"}
    rows:
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8480-6", code_system: "http://loinc.org", code_display: "Systolic blood pressure",
         value: 186, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8462-4", code_system: "http://loinc.org", code_display: "Diastolic blood pressure",
         value: 112, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8867-4", code_system: "http://loinc.org", code_display: "Heart rate",
         value: 92, unit: "/min", unit_system: "http://unitsofmeasure.org"}
      # What the handover and its reply wrote. handover.raised is derived from
      # the first of these, which is what puts Reply on the doctor's screen.
      - resource: questionnaire_response
        operation: phc.op.handover
        questionnaire: phc.schema.handover-v1
        created_by: "user:nurse"
        payload: {to: mo, note: "BP 190/125 on two readings, headache since morning. Please see before the queue.", priority: urgent}
      - resource: questionnaire_response
        operation: phc.op.handover-reply
        questionnaire: phc.schema.handover-reply-v1
        created_by: "user:mo"
        payload: {comment: "Coming now. Keep her in the side room.", state: acknowledged}
    # Asked at the desk and agreed. Since 2026-11-01 the recording would be
    # offerable either way: capture.consented is composed from the absence of
    # a refusal, not from this. Kept so the seeded day still has a visit where
    # the question was put and answered yes.
    flags: [vitals.flagged, capture.agreed]
    # A handover conversation, so the demo day has one (§12.3). The rows are
    # what the operations write; the audit entries are what the thread draws
    # from. Both, or the flag is raised with nothing on screen to explain it.
    audit:
      - operation: phc.op.handover
        actor: "user:nurse"
        payload: {to: mo, note: "BP 190/125 on two readings, headache since morning. Please see before the queue.", priority: urgent}
      - operation: phc.op.handover-reply
        actor: "user:mo"
        payload: {comment: "Coming now. Keep her in the side room.", state: acknowledged}
      - operation: phc.op.patient-register
        actor: "user:frontdesk"
        payload: {name: Ramesh Kumar, age: 61, sex: male, phone: "9800000003",
                  village: Bhagwanpur, category: ncd, capture_consent: true}
      - operation: phc.op.vitals-record
        actor: "user:nurse"
        payload: {systolic: 186, diastolic: 112, pulse: 92, spo2: 97,
                  weight: 71, temperature: 36.8}

  # Seen and sent to the laboratory. Carries the one proposal a person has
  # not yet accepted, so the confirm path has a subject the moment the app
  # starts: the agent read the note over MCP and offered a prescription.
  # The second poster arrival of the day, and the one that shows the mark is
  # not a different queue: he scanned on the way in and sits between two
  # patients the desk registered.
  - id: enc-004
    token: "4"
    status: in_progress
    arrival: poster
    patient: {operation: phc.op.patient-register, name: Iqbal Ahmed, age: 52, sex: male, phone: "9800000004",
              village: Sonpur, category: general,
              abha_number: "12-3456-7890-5678"}
    rows:
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8480-6", code_system: "http://loinc.org", code_display: "Systolic blood pressure",
         value: 118, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8462-4", code_system: "http://loinc.org", code_display: "Diastolic blood pressure",
         value: 76, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8867-4", code_system: "http://loinc.org", code_display: "Heart rate",
         value: 92, unit: "/min", unit_system: "http://unitsofmeasure.org"}
      - {resource: notes, operation: phc.op.consult-document, text: "Fever three days, no red flags on examination."}
      - {resource: service_request, operation: phc.op.lab-order, code: CBC, status: active}
    # Said no to the recording. The consultation was typed, the queue badges
    # the visit declined, and nothing asks again.
    flags: [capture.declined]
    audit:
      - operation: phc.op.patient-register
        actor: "user:frontdesk"
        payload: {name: Iqbal Ahmed, age: 52, sex: male, phone: "9800000004",
                  village: Sonpur, category: general, capture_declined: true}
      - operation: phc.op.vitals-record
        actor: "user:nurse"
        payload: {systolic: 118, diastolic: 76, pulse: 92, spo2: 98,
                  weight: 64, temperature: 38.1}
      - operation: phc.op.consult-document
        actor: "user:mo"
        payload:
          history: Fever three days, no cough, no urinary symptoms.
          examination: Chest clear, abdomen soft, no rash.
          assessment: Fever three days, no red flags on examination.
          plan: Blood count today, review with the result.
      - operation: phc.op.lab-order
        actor: "user:mo"
        payload: {investigations: [CBC]}
    proposals:
      - id: seed-prop-001
        operation: phc.op.rx-prescribe
        proposed_by: "agent:demo"
        surface: mcp
        payload:
          medications:
            - {drug: "774586009", dose: 500, dose_unit: "mg",
               route: "26643006", frequency: "229798009",
               duration: 5, duration_unit: "d"}

  # Prescribed, waiting at the pharmacy.
  - id: enc-005
    token: "3"
    status: in_progress
    patient: {operation: phc.op.patient-register, name: Sunita Bai, age: 27, sex: female, phone: "9800000005",
              village: Rampur, category: general}
    rows:
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8480-6", code_system: "http://loinc.org", code_display: "Systolic blood pressure",
         value: 118, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8462-4", code_system: "http://loinc.org", code_display: "Diastolic blood pressure",
         value: 76, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8867-4", code_system: "http://loinc.org", code_display: "Heart rate",
         value: 92, unit: "/min", unit_system: "http://unitsofmeasure.org"}
      - {resource: notes, operation: phc.op.consult-document, text: "Fever three days, no red flags on examination."}
      # A prescription line is five columns now, not a sentence, and the
      # codes are the value sets' own. Oral rehydration salts are advised in
      # the plan narrative and not prescribed here, because this build cannot
      # code them: the medicine value set is six primary level essential
      # medicines and it says in the file that it is not a formulary.
      - {resource: medication_request, operation: phc.op.rx-prescribe,
         medication: "777067000", medication_system: "http://snomed.info/sct",
         medication_display: "Acetaminophen only product",
         dose: 500, dose_unit: "mg", dose_unit_system: "http://unitsofmeasure.org",
         route: "26643006", route_system: "http://snomed.info/sct",
         route_display: "Oral route",
         frequency: "229798009", frequency_system: "http://snomed.info/sct",
         frequency_display: "Three times daily",
         duration: 3, duration_unit: "d",
         duration_unit_system: "http://unitsofmeasure.org",
         intent: order, status: active}
    audit:
      - operation: phc.op.patient-register
        actor: "user:frontdesk"
        payload: {name: Sunita Bai, age: 27, sex: female, phone: "9800000005",
                  village: Rampur, category: general}
      - operation: phc.op.vitals-record
        actor: "user:nurse"
        payload: {systolic: 118, diastolic: 76, pulse: 92, spo2: 99,
                  weight: 49, temperature: 37.6}
      - operation: phc.op.consult-document
        actor: "user:mo"
        payload:
          history: Fever three days, loose stools since yesterday.
          examination: Hydrated, chest clear, abdomen soft.
          assessment: Fever three days, no red flags on examination.
          diagnosis:
            # Coded as a clinical finding, with the clinician's own
            # verification status rather than a literal that asserted every
            # diagnosis. See catalogue/ops/phc.op.consult-document.md.
            - {condition: "297142003", clinical_status: active,
               verification_status: unconfirmed}
          plan: Paracetamol and oral rehydration, return if it worsens.
      - operation: phc.op.rx-prescribe
        actor: "user:mo"
        payload:
          medications:
            - {drug: "777067000", dose: 500, dose_unit: "mg",
               route: "26643006", frequency: "229798009",
               duration: 3, duration_unit: "d"}

  # Dispensed and closed. Stands nowhere; the line is complete.
  # Registered at the desk, and her national account was linked there too:
  # her audit carries the abha-link line that the two poster arrivals above do
  # not need. So a lotus on a row does not mean somebody scanned a poster, and
  # this is the thread that proves the two facts are separate.
  - id: enc-006
    token: "2"
    status: completed
    patient: {operation: phc.op.patient-register, name: Meera Patel, age: 45, sex: female, phone: "9800000006",
              village: Rampur, category: ncd,
              abha_number: "12-3456-7890-9012"}
    rows:
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8480-6", code_system: "http://loinc.org", code_display: "Systolic blood pressure",
         value: 118, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8462-4", code_system: "http://loinc.org", code_display: "Diastolic blood pressure",
         value: 76, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8867-4", code_system: "http://loinc.org", code_display: "Heart rate",
         value: 92, unit: "/min", unit_system: "http://unitsofmeasure.org"}
      - {resource: notes, operation: phc.op.consult-document, text: "Fever three days, no red flags on examination."}
      # A prescription line is five columns now, not a sentence, and the
      # codes are the value sets' own. Oral rehydration salts are advised in
      # the plan narrative and not prescribed here, because this build cannot
      # code them: the medicine value set is six primary level essential
      # medicines and it says in the file that it is not a formulary.
      - {resource: medication_request, operation: phc.op.rx-prescribe,
         medication: "777067000", medication_system: "http://snomed.info/sct",
         medication_display: "Acetaminophen only product",
         dose: 500, dose_unit: "mg", dose_unit_system: "http://unitsofmeasure.org",
         route: "26643006", route_system: "http://snomed.info/sct",
         route_display: "Oral route",
         frequency: "229798009", frequency_system: "http://snomed.info/sct",
         frequency_display: "Three times daily",
         duration: 3, duration_unit: "d",
         duration_unit_system: "http://unitsofmeasure.org",
         intent: order, status: active}
      - {resource: medication_dispense, operation: phc.op.pharmacy-dispense, medication: Paracetamol 500mg,
         quantity: "1", status: completed}
      - {resource: medication_dispense, operation: phc.op.pharmacy-dispense, medication: ORS sachet,
         quantity: "1", status: completed}
    audit:
      - operation: phc.op.patient-register
        actor: "user:frontdesk"
        payload: {name: Meera Patel, age: 45, sex: female, phone: "9800000006",
                  village: Rampur, category: ncd}
      - operation: phc.op.abha-link
        actor: "user:frontdesk"
        payload: {method: link_existing, abha_number: "12-3456-7890-9012",
                  consent_given: true}
      - operation: phc.op.vitals-record
        actor: "user:nurse"
        payload: {systolic: 118, diastolic: 76, pulse: 92, spo2: 98,
                  weight: 58, temperature: 37.2}
      - operation: phc.op.consult-document
        actor: "user:mo"
        payload:
          history: Fever three days, loose stools since yesterday.
          examination: Hydrated, chest clear, abdomen soft.
          assessment: Fever three days, no red flags on examination.
          diagnosis:
            # Coded as a clinical finding, with the clinician's own
            # verification status rather than a literal that asserted every
            # diagnosis. See catalogue/ops/phc.op.consult-document.md.
            - {condition: "297142003", clinical_status: active,
               verification_status: unconfirmed}
          plan: Paracetamol and oral rehydration, return if it worsens.
      - operation: phc.op.rx-prescribe
        actor: "user:mo"
        payload:
          medications:
            - {drug: "777067000", dose: 500, dose_unit: "mg",
               route: "26643006", frequency: "229798009",
               duration: 3, duration_unit: "d"}
      - operation: phc.op.pharmacy-dispense
        actor: "user:pharmacist"
        payload:
          dispenses:
            - {medication: Paracetamol 500mg, quantity: "1"}
            - {medication: ORS sachet, quantity: "1"}
          partial: false

  # Ramesh Kumar, three months ago. The same person as enc-003, not a second
  # registration: `same_patient_as` points this encounter at the patient row
  # that thread already created.
  #
  # It exists because a spine with one visit per person proves nothing. Every
  # other seeded thread makes its own patient, so without this the patient
  # screen (§7, kernel/spine.py) would draw a single visit for everybody and
  # a join that had stopped joining would look exactly the same.
  # Its token is from THAT day's sequence, not today's: the sequence restarts
  # every morning, so a number only means anything beside its own date.
  # A PREGNANCY IN THE MIDDLE OF ITS ARC, and the one thread that
  # demonstrates the tracker rather than the line.
  #
  # Dated 210 days before whichever day this file is opened, from a
  # remembered last period, so the demo never drifts. At 30 weeks she is in
  # the window of her third contact, her first was attended four months ago,
  # and her second was not attended at all.
  #
  # THAT SHAPE IS THE POINT: a done one, a missed one and a due one on the
  # same woman, on one screen. A fixture where everything is green proves
  # nothing about a tracker, and one where everything is red proves nothing
  # about recording.
  #
  # `anchor_date_days_ago` is read by the seed writer in both engines and
  # becomes a date relative to the demo day. A literal would be right on the
  # day it was typed and a month stale a month later.
  - id: enc-007
    token: "7"
    status: in_progress
    patient: {operation: phc.op.patient-register, name: Lakshmi Devi, age: 24, sex: female,
              phone: "9800000007", village: Sonpur, category: anc}
    rows:
      - {resource: episode_of_care, operation: phc.op.pregnancy-open, type: pregnancy,
         status: active, anchor_date_days_ago: 210, anchor_basis: last_menstrual_period}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8480-6", code_system: "http://loinc.org", code_display: "Systolic blood pressure",
         value: 118, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8462-4", code_system: "http://loinc.org", code_display: "Diastolic blood pressure",
         value: 74, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
    audit:
      - {operation: phc.op.pregnancy-open, actor: "user:anm", days_ago: 150,
         payload: {dating_basis: last_menstrual_period, dating_date: "2026-01-01"}}
      # Her first antenatal contact, attended at about eleven weeks. Four
      # months ago, so it falls inside that contact's own window and closes
      # it; an entry stamped today would close whichever contact is open NOW
      # instead, which is the bug this backdating exists to avoid.
      - {operation: phc.op.antenatal-visit, actor: "user:cho", days_ago: 133,
         payload: {history: "First visit. No bleeding, no fever.",
                   examination: "Uterus consistent with dates.",
                   assessment: "Progressing normally.",
                   plan: "Iron and folic acid started. Review as scheduled."}}
      - {operation: phc.op.vitals-record, actor: "user:nurse",
         payload: {systolic: 118, diastolic: 74, pulse: 78}}

  - id: enc-000
    token: "12"
    status: completed
    same_patient_as: enc-003
    minutes_ago: 129600          # ninety days, so the timeline has a gap in it
    rows:
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8480-6", code_system: "http://loinc.org", code_display: "Systolic blood pressure",
         value: 148, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: observation, operation: phc.op.vitals-record, status: final, category: vital-signs,
         code: "8462-4", code_system: "http://loinc.org", code_display: "Diastolic blood pressure",
         value: 94, unit: "mm[Hg]", unit_system: "http://unitsofmeasure.org"}
      - {resource: notes, operation: phc.op.consult-document, text: "Raised pressure on two readings. Advised salt reduction, review in three months."}
    flags: [vitals.flagged]
    audit:
      - operation: phc.op.vitals-record
        actor: "user:nurse"
        payload: {systolic: 148, diastolic: 94, pulse: 88}
      - operation: phc.op.consult-document
        actor: "user:mo"
        payload:
          history: Headache on waking for two weeks.
          examination: No focal neurological deficit.
          assessment: Raised blood pressure, first presentation.
          plan: Salt reduction advised. Review in three months.
